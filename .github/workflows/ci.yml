name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node tests
        run: npm test
      - name: Python unit tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests
      - name: Gallery freshness
        run: |
          npm run build:galleries
          git diff --exit-code -- gallery/
      - name: Audit and manifest freshness
        run: |
          python scripts/audit.py . --manifest
          git diff --exit-code -- MANIFEST.json
