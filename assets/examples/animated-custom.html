<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion recipe — sequence, focus, final state</title><style>
/* Keep meaning in the DOM. Animation changes emphasis, not the underlying facts. */
:root{--paper:#111923;--ink:#f3f6fa;--accent:#aedc68}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans CJK JP',sans-serif}.slide{width:1280px;height:720px;position:relative;padding:72px;overflow:hidden}.label{font-size:17px;color:var(--accent);letter-spacing:2px}h1{font-size:56px;line-height:1.25;max-width:1100px;margin:35px 0}p{font-size:25px;line-height:1.7}.diagram{margin-top:45px;display:grid;grid-template-columns:repeat(3,1fr);gap:35px}.item{border-top:3px solid var(--accent);padding-top:22px;opacity:.15;transform:translateY(12px);transition:opacity .35s ease,transform .35s ease}.item strong{font-size:31px}.item p{font-size:22px;max-width:320px}.item.active{opacity:1;transform:none}button{position:fixed;bottom:24px;right:35px;padding:12px 18px;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:4px;font:18px sans-serif}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.trace{position:absolute;left:72px;bottom:100px;width:1136px;height:15px}.trace path{stroke:var(--accent);stroke-width:3;fill:none;stroke-dasharray:1136;stroke-dashoffset:1136;transition:stroke-dashoffset .8s ease}.complete .trace path{stroke-dashoffset:0}.footer{position:absolute;left:72px;bottom:32px;font-size:15px;color:#aab6c4}
/* The export contract is explicit. Never capture a half-completed transition by luck. */
body[data-export=true] .item{opacity:1;transform:none;transition:none}body[data-export=true] .trace path{stroke-dashoffset:0;transition:none}body[data-export=true] button{display:none}
@media(prefers-reduced-motion:reduce){.item,.trace path{transition:none;transform:none}}
@page{size:13.333333in 7.5in;margin:0}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.item{opacity:1;transform:none}.trace path{stroke-dashoffset:0}button{display:none}}
</style></head><body><section class="slide" aria-label="例外処理の設計"><div class="label">SEQUENCE / MOTION RECIPE</div><h1>例外を先に、仕組みの中へ置く。</h1><div class="diagram"><div class="item active"><strong>01　集める</strong><p>止まった処理を記録する。</p></div><div class="item"><strong>02　分ける</strong><p>繰り返す例外を分類する。</p></div><div class="item"><strong>03　設計する</strong><p>人へ戻す条件を決める。</p></div></div><svg class="trace" viewBox="0 0 1136 15" aria-hidden="true"><path d="M0 7H1136"/></svg><div class="footer">説明用レシピ / 静止出力では全ステップを表示</div></section><button id="next">次のステップ →</button><script>
// Explicit states make narration predictable. There is no timer or autoplay.
const items=[...document.querySelectorAll('.item')];let step=0;const button=document.getElementById('next');function show(){items.forEach((el,i)=>el.classList.toggle('active',i<=step));document.body.classList.toggle('complete',step===2);button.textContent=step===2?'最初から':'次のステップ →'}function next(){step=(step+1)%3;show()}button.onclick=next;document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){step=Math.max(0,step-1);show()}});show();
</script></body></html>
