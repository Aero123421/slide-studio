<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="area-partition-fig-title area-partition-fig-desc" id="area-partition-fig" class="ss-fig" direction="ltr" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Mincho ProN&quot;,&quot;Noto Serif JP&quot;,&quot;Yu Mincho&quot;,&quot;IPAMincho&quot;,serif" style="overflow:visible;direction:ltr;"><title id="area-partition-fig-title">Revenue by product category, fiscal 2025, as an area partition of the total</title><desc id="area-partition-fig-desc">The rectangle is all revenue, €4.20bn. Each tile&#39;s area is its exact share: Handbags 29%, Ready-to-wear 20%, Jewellery 17%, Fragrance and beauty 10%, Watches 9%, Small leather goods 8%, Shoes 5%, Luggage 3%.</desc><rect x="0" y="0" width="1152" height="470" fill="#151412"/><text x="0" y="20.12" font-size="17" fill="#ebe4d5" font-weight="700">All revenue, fiscal 2025: €4.20bn</text><text x="1152" y="19.4" font-size="15" text-anchor="end" fill="#aaa08d">Tile area = share of revenue</text><g class="ss-tile"><rect x="0" y="34" width="331.89" height="436" fill="#c9b27c" stroke="#151412" stroke-width="3"/><text x="14" y="78.56" font-size="44" fill="#151412" font-weight="700" font-variant-numeric="tabular-nums">29%</text><text x="14" y="114.58" font-size="17" fill="#151412" font-weight="700">Handbags</text><text x="14" y="138.1" font-size="15" fill="#151412" font-variant-numeric="tabular-nums">€1.21bn</text></g><g class="ss-tile"><rect x="331.89" y="34" width="230.4" height="436" fill="#211f1b" stroke="#151412" stroke-width="3"/><text x="345.89" y="65.24" font-size="26" fill="#ebe4d5" font-weight="700" font-variant-numeric="tabular-nums">20%</text><text x="345.89" y="96.58" font-size="17" fill="#ebe4d5" font-weight="700">Ready-to-wear</text><text x="345.89" y="120.1" font-size="15" fill="#aaa08d" font-variant-numeric="tabular-nums">€0.84bn</text></g><g class="ss-tile"><rect x="562.29" y="34" width="309.94" height="273.95" fill="#211f1b" stroke="#151412" stroke-width="3"/><text x="576.29" y="65.24" font-size="26" fill="#ebe4d5" font-weight="700" font-variant-numeric="tabular-nums">17%</text><text x="576.29" y="96.58" font-size="17" fill="#ebe4d5" font-weight="700">Jewellery</text><text x="576.29" y="120.1" font-size="15" fill="#aaa08d" font-variant-numeric="tabular-nums">€0.71bn</text></g><g class="ss-tile"><rect x="562.29" y="307.95" width="309.94" height="162.05" fill="#211f1b" stroke="#151412" stroke-width="3"/><text x="576.29" y="339.19" font-size="26" fill="#ebe4d5" font-weight="700" font-variant-numeric="tabular-nums">10%</text><text x="576.29" y="370.53" font-size="17" fill="#ebe4d5" font-weight="700">Fragrance and beauty</text><text x="576.29" y="394.05" font-size="15" fill="#aaa08d" font-variant-numeric="tabular-nums">€0.42bn</text></g><g class="ss-tile"><rect x="872.23" y="34" width="279.77" height="162.43" fill="#211f1b" stroke="#151412" stroke-width="3"/><text x="886.23" y="65.24" font-size="26" fill="#ebe4d5" font-weight="700" font-variant-numeric="tabular-nums">9%</text><text x="886.23" y="96.58" font-size="17" fill="#ebe4d5" font-weight="700">Watches</text><text x="886.23" y="120.1" font-size="15" fill="#aaa08d" font-variant-numeric="tabular-nums">€0.38bn</text></g><g class="ss-tile"><rect x="872.23" y="196.43" width="144.26" height="273.57" fill="#211f1b" stroke="#151412" stroke-width="3"/><text x="886.23" y="227.67" font-size="26" fill="#ebe4d5" font-weight="700" font-variant-numeric="tabular-nums">8%</text><text x="886.23" y="259.01" font-size="17" fill="#ebe4d5" font-weight="700"><tspan x="886.23" y="259.01">Small leather</tspan><tspan x="886.23" dy="20.74">goods</tspan></text><text x="886.23" y="303.53" font-size="15" fill="#aaa08d" font-variant-numeric="tabular-nums">€0.33bn</text></g><g class="ss-tile"><rect x="1016.49" y="196.43" width="135.51" height="167.67" fill="#211f1b" stroke="#151412" stroke-width="3"/><text x="1030.49" y="227.67" font-size="26" fill="#ebe4d5" font-weight="700" font-variant-numeric="tabular-nums">5%</text><text x="1030.49" y="259.01" font-size="17" fill="#ebe4d5" font-weight="700">Shoes</text><text x="1030.49" y="282.53" font-size="15" fill="#aaa08d" font-variant-numeric="tabular-nums">€0.19bn</text></g><g class="ss-tile"><rect x="1016.49" y="364.1" width="135.51" height="105.9" fill="#211f1b" stroke="#151412" stroke-width="3"/><text x="1030.49" y="395.34" font-size="26" fill="#ebe4d5" font-weight="700" font-variant-numeric="tabular-nums">3%</text><text x="1030.49" y="426.68" font-size="17" fill="#ebe4d5" font-weight="700">Luggage</text><text x="1030.49" y="450.2" font-size="15" fill="#aaa08d" font-variant-numeric="tabular-nums">€0.12bn</text></g><rect x="1" y="35" width="1150" height="434" fill="none" stroke="#ebe4d5" stroke-width="2"/></svg>
