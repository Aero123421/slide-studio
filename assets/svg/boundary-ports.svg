<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 444" width="1152" height="444" role="img" aria-labelledby="boundary-ports-fig-title boundary-ports-fig-desc" id="boundary-ports-fig" class="ss-fig" font-family="&quot;Avenir Next&quot;,&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="boundary-ports-fig-title">Orders and Billing domains, connected only through named ports</title><desc id="boundary-ports-fig-desc">Two domains drawn as boundaries; squares on the boundaries are ports. 3 flows cross between the domains, each leaving through an out-port and arriving through an in-port: order.placed (1,850 per hour), payment.settled (1,790 per hour), return.approved (64 per hour). Arrows mean events flowing from producer to consumer. Thin lines inside a domain are internal reads and writes. The dashed line is the retired direct read from Invoicing into the order database, which crossed both boundaries without a port.</desc><rect x="0" y="0" width="1152" height="444" fill="#e4eaf1"/><defs><marker id="boundary-ports-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#14243a"/></marker></defs><path d="M16 40H454Q470 40 470 56V426Q470 442 454 442H16Q0 442 0 426V56Q0 40 16 40Z" fill="#f2f5f9" stroke="#14243a" stroke-width="1.6"/><text x="24" y="74.06" font-size="19" fill="#14243a" font-weight="700">Orders domain</text><path d="M698 40H1136Q1152 40 1152 56V426Q1152 442 1136 442H698Q682 442 682 426V56Q682 40 698 40Z" fill="#f2f5f9" stroke="#14243a" stroke-width="1.6"/><text x="706" y="74.06" font-size="19" fill="#14243a" font-weight="700">Billing domain</text><line x1="208" y1="262" x2="262" y2="150" stroke="#45566b" stroke-width="1.3"/><line x1="208" y1="262" x2="262" y2="262" stroke="#45566b" stroke-width="1.3"/><line x1="208" y1="262" x2="262" y2="374" stroke="#45566b" stroke-width="1.3"/><line x1="892" y1="150" x2="946" y2="262" stroke="#45566b" stroke-width="1.3"/><line x1="892" y1="262" x2="946" y2="262" stroke="#45566b" stroke-width="1.3"/><line x1="892" y1="374" x2="946" y2="262" stroke="#45566b" stroke-width="1.3"/><path d="M801 122.41V14H117V213.82" fill="none" stroke="#45566b" stroke-width="1.6" stroke-dasharray="6 6"/><text x="576" y="8" font-size="16" text-anchor="middle" fill="#45566b" font-style="italic">direct SQL read, retired in March</text><line x1="444" x2="462" y1="150" y2="150" stroke="#14243a" stroke-width="2"/><line x1="478" x2="674" y1="150" y2="150" stroke="#14243a" stroke-width="2"/><line x1="690" x2="706" y1="150" y2="150" stroke="#14243a" stroke-width="2" marker-end="url(#boundary-ports-fig-arr)"/><rect x="462" y="142" width="16" height="16" rx="2" fill="#1c4f9e"/><rect x="674" y="142" width="16" height="16" rx="2" fill="#1c4f9e"/><text x="576" y="138" font-size="17" text-anchor="middle" fill="#14243a" font-weight="700" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace">order.placed</text><text x="576" y="175.1" font-size="15" text-anchor="middle" fill="#45566b" font-variant-numeric="tabular-nums">1,850 / hour</text><line x1="710" x2="690" y1="262" y2="262" stroke="#14243a" stroke-width="2"/><line x1="674" x2="478" y1="262" y2="262" stroke="#14243a" stroke-width="2"/><line x1="462" x2="448" y1="262" y2="262" stroke="#14243a" stroke-width="2" marker-end="url(#boundary-ports-fig-arr)"/><rect x="674" y="254" width="16" height="16" rx="2" fill="#1c4f9e"/><rect x="462" y="254" width="16" height="16" rx="2" fill="#1c4f9e"/><text x="576" y="250" font-size="17" text-anchor="middle" fill="#14243a" font-weight="700" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace">payment.settled</text><text x="576" y="287.1" font-size="15" text-anchor="middle" fill="#45566b" font-variant-numeric="tabular-nums">1,790 / hour</text><line x1="444" x2="462" y1="374" y2="374" stroke="#14243a" stroke-width="2"/><line x1="478" x2="674" y1="374" y2="374" stroke="#14243a" stroke-width="2"/><line x1="690" x2="706" y1="374" y2="374" stroke="#14243a" stroke-width="2" marker-end="url(#boundary-ports-fig-arr)"/><rect x="462" y="366" width="16" height="16" rx="2" fill="#1c4f9e"/><rect x="674" y="366" width="16" height="16" rx="2" fill="#1c4f9e"/><text x="576" y="362" font-size="17" text-anchor="middle" fill="#14243a" font-weight="700" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace">return.approved</text><text x="576" y="399.1" font-size="15" text-anchor="middle" fill="#45566b" font-variant-numeric="tabular-nums">64 / hour</text><g class="ss-node ss-node-store"><g><path d="M26 225.82V298.18A91 9 0 0 0 208 298.18V225.82" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/><ellipse cx="117" cy="225.82" rx="91" ry="9" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/></g><text x="117" y="255.16" font-size="19" text-anchor="middle" fill="#14243a" font-weight="600"><tspan x="117" y="255.16">Order</tspan><tspan x="117" dy="23.18">database</tspan></text></g><g class="ss-node ss-node-process"><rect x="262" y="122.41" width="182" height="55.18" rx="10" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/><text x="353" y="154.75" font-size="19" text-anchor="middle" fill="#14243a" font-weight="600">Checkout</text></g><g class="ss-node ss-node-process"><rect x="262" y="234.41" width="182" height="55.18" rx="10" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/><text x="353" y="266.75" font-size="19" text-anchor="middle" fill="#14243a" font-weight="600">Order status</text></g><g class="ss-node ss-node-process"><rect x="262" y="346.41" width="182" height="55.18" rx="10" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/><text x="353" y="378.75" font-size="19" text-anchor="middle" fill="#14243a" font-weight="600">Returns</text></g><g class="ss-node ss-node-process"><rect x="710" y="122.41" width="182" height="55.18" rx="10" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/><text x="801" y="154.75" font-size="19" text-anchor="middle" fill="#14243a" font-weight="600">Invoicing</text></g><g class="ss-node ss-node-process"><rect x="710" y="234.41" width="182" height="55.18" rx="10" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/><text x="801" y="266.75" font-size="19" text-anchor="middle" fill="#14243a" font-weight="600">Settlement</text></g><g class="ss-node ss-node-process"><rect x="710" y="346.41" width="182" height="55.18" rx="10" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/><text x="801" y="378.75" font-size="19" text-anchor="middle" fill="#14243a" font-weight="600">Refunds</text></g><g class="ss-node ss-node-store"><g><path d="M946 237.41V286.59A91 9 0 0 0 1128 286.59V237.41" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/><ellipse cx="1037" cy="237.41" rx="91" ry="9" fill="#e4eaf1" stroke="#b5c3d3" stroke-width="1.4"/></g><text x="1037" y="266.75" font-size="19" text-anchor="middle" fill="#14243a" font-weight="600">Ledger</text></g></svg>
