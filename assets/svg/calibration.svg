<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="calibration-fig-title calibration-fig-desc" id="calibration-fig" class="ss-fig" direction="ltr" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="calibration-fig-title">Reliability diagram for the pump-failure risk model, 10 equal-width bins</title><desc id="calibration-fig-desc">Below 30% predicted risk, observed failure rates are within 2 percentage points of the prediction. Above 30%, 7 of 7 bins observe fewer failures than predicted; the 80%–90% bin predicts 86% and observes 58% (n = 31). Most predictions sit below 10%.</desc><rect x="0" y="0" width="800" height="470" fill="#fcfcfb"/><g class="ss-axis"><line x1="61.37" x2="770" y1="310" y2="310" stroke="#161c1a" stroke-width="1.4" class="ss-zero"/><text x="53.37" y="315.76" font-size="16" text-anchor="end" fill="#54605c" class="ss-axis-label" font-variant-numeric="tabular-nums">0%</text><line x1="61.37" x2="770" y1="256.4" y2="256.4" stroke="#e7e9e8" stroke-width="1" class="ss-grid"/><text x="53.37" y="262.16" font-size="16" text-anchor="end" fill="#54605c" class="ss-axis-label" font-variant-numeric="tabular-nums">20%</text><line x1="61.37" x2="770" y1="202.8" y2="202.8" stroke="#e7e9e8" stroke-width="1" class="ss-grid"/><text x="53.37" y="208.56" font-size="16" text-anchor="end" fill="#54605c" class="ss-axis-label" font-variant-numeric="tabular-nums">40%</text><line x1="61.37" x2="770" y1="149.2" y2="149.2" stroke="#e7e9e8" stroke-width="1" class="ss-grid"/><text x="53.37" y="154.96" font-size="16" text-anchor="end" fill="#54605c" class="ss-axis-label" font-variant-numeric="tabular-nums">60%</text><line x1="61.37" x2="770" y1="95.6" y2="95.6" stroke="#e7e9e8" stroke-wi