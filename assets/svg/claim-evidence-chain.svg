<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 482" width="1152" height="482" role="img" aria-labelledby="claim-evidence-chain-fig-title claim-evidence-chain-fig-desc" id="claim-evidence-chain-fig" class="ss-fig" direction="ltr" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="claim-evidence-chain-fig-title">From observation to interpretation to the next test, for an accuracy drop after a tokenizer change</title><desc id="claim-evidence-chain-fig-desc">Observation: overall accuracy fell from 82.6% to 77.1% (5.5 points) on 2,400 held-out questions. No numbers: 86.1% to 85.7% (n = 1,210); 1–5 digits: 82.3% to 80.9% (n = 578); 6+ digits: 75.8% to 56.4% (n = 612). 6+ digits questions account for 90% of the drop. Interpretation, not yet shown: the new tokenizer splits long numbers; truncation is not ruled out. Next test: re-score those questions with the old tokenizer; a gap under 2 points would attribute the drop to the tokenizer. Arrows mean &quot;suggests&quot; and &quot;is tested by&quot;.</desc><rect x="0" y="0" width="1152" height="482" fill="#ffffff"/><defs><marker id="claim-evidence-chain-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#1a1f2b"/></marker></defs><text x="0" y="18.8" font-size="20" fill="#1a1f2b" font-weight="700">Observation</text><text x="0" y="43.84" font-size="16" fill="#525b6b">measured on 2,400 held-out questions</text><line x1="134" x2="134" y1="92" y2="414" stroke="#e9ebef"/><text x="134" y="433.1" font-size="15" text-anchor="middle" fill="#525b6b">50%</text><line x1="211" x2="211" y1="92" y2="414" stroke="#e9ebef"/><text x="211" y="433.1" font-size="15" text-anchor="middle" fill="#525b6b">60%</text><line x1="288" x2="288" y1="92" y2="414" stroke="#e9ebef"/><text x="288" y="433.1" font-size="15" text-anchor="middle" fill="#525b6b">70%</text><line x1="365" x2="365" y1="92" y2="414" stroke="#e9ebef"/><text x="365" y="433.1" font-size="15" text-anchor="middle" fill="#525b6b">80%</text><line x1="442" x2="442" y1="92" y2="414" stroke="#e9ebef"/><text x="442" y="433.1" font-size="15" text-anchor="middle" fill="#525b6b">90%</text><text x="0" y="147.48" font-size="18" fill="#1a1f2b" font-weight="700">No numbers</text><text x="0" y="169.4" font-size="15" fill="#525b6b">n = 1,210</text><line x1="408.89" x2="411.97" y1="150" y2="150" stroke="#525b6b" stroke-width="2.5"/><circle cx="411.97" cy="150" r="7" fill="#ffffff" stroke="#1a1f2b" stroke-width="2.2"/><circle cx="408.89" cy="150" r="8" fill="#1a1f2b"/><text x="394.89" y="137.76" font-size="16" text-anchor="end" fill="#1a1f2b" font-weight="700">85.7</text><text x="423.97" y="137.76" font-size="16" fill="#525b6b">86.1</text><text x="0" y="259.48" font-size="18" fill="#1a1f2b" font-weight="700">1–5 digits</text><text x="0" y="281.4" font-size="15" fill="#525b6b">n = 578</text><line x1="371.93" x2="382.71" y1="262" y2="262" stroke="#525b6b" stroke-width="2.5"/><circle cx="382.71" cy="262" r="7" fill="#ffffff" stroke="#1a1f2b" stroke-width="2.2"/><circle cx="371.93" cy="262" r="8" fill="#1a1f2b"/><text x="357.93" y="249.76" font-size="16" text-anchor="end" fill="#1a1f2b" font-weight="700">80.9</text><text x="394.71" y="249.76" font-size="16" fill="#525b6b">82.3</text><text x="0" y="371.48" font-size="18" fill="#c2286e" font-weight="700">6+ digits</text><text x="0" y="393.4" font-size="15" fill="#525b6b">n = 612</text><line x1="183.28" x2="332.66" y1="374" y2="374" stroke="#c2286e" stroke-width="4"/><circle cx="332.66" cy="374" r="7" fill="#ffffff" stroke="#1a1f2b" stroke-width="2.2"/><circle cx="183.28" cy="374" r="8" fill="#c2286e"/><text x="169.28" y="361.76" font-size="16" text-anchor="end" fill="#c2286e" font-weight="700">56.4</text><text x="344.66" y="361.76" font-size="16" fill="#525b6b">75.8</text><circle cx="140" cy="82" r="6" fill="#ffffff" stroke="#1a1f2b" stroke-width="2"/><text x="152" y="87.4" font-size="15" fill="#525b6b">old tokenizer</text><circle cx="278" cy="82" r="6" fill="#1a1f2b"/><text x="290" y="87.4" font-size="15" fill="#525b6b">new</text><text x="552" y="18.8" font-size="20" fill="#1a1f2b" font-weight="700">Interpretation</text><text x="552" y="43.84" font-size="16" fill="#525b6b">not yet shown</text><text x="552" y="123.32" font-size="18" fill="#1a1f2b" font-weight="700">Likely</text><text x="552" y="148.52" font-size="18" fill="#1a1f2b"><tspan x="552" y="148.52">The new tokenizer splits long</tspan><tspan x="552" dy="24.84">numbers into more pieces, and</tspan><tspan x="552" dy="24.84">the model copies digits</tspan><tspan x="552" dy="24.84">wrongly.</tspan></text><text x="552" y="313.32" font-size="18" fill="#525b6b" font-weight="700">Not ruled out</text><text x="552" y="338.52" font-size="18" fill="#1a1f2b"><tspan x="552" y="338.52">Number-heavy questions are</tspan><tspan x="552" dy="24.84">longer and may be cut by the</tspan><tspan x="552" dy="24.84">4k context limit.</tspan></text><text x="896" y="18.8" font-size="20" fill="#1a1f2b" font-weight="700">Next test</text><text x="896" y="43.84" font-size="16" fill="#525b6b">one run, nothing else changed</text><text x="896" y="123.32" font-size="18" fill="#1a1f2b"><tspan x="896" y="123.32">Re-score the 612 questions</tspan><tspan x="896" dy="24.84">containing 6+ digit numbers,</tspan><tspan x="896" dy="24.84">using the old tokenizer.</tspan></text><text x="896" y="291.32" font-size="18" fill="#1a1f2b" font-weight="700">Gap under 2 points</text><text x="896" y="316.52" font-size="18" fill="#1a1f2b">The tokenizer explains it.</text><text x="896" y="391.32" font-size="18" fill="#1a1f2b" font-weight="700">Gap stays</text><text x="896" y="416.52" font-size="18" fill="#1a1f2b">Test truncation next.</text><g><line x1="470" x2="530" y1="232" y2="232" stroke="#1a1f2b" stroke-width="2" marker-end="url(#claim-evidence-chain-fig-arr)"/><text x="500" y="222" font-size="16" text-anchor="middle" fill="#525b6b" font-weight="600">suggests</text></g><g><line x1="830" x2="874" y1="232" y2="232" stroke="#1a1f2b" stroke-width="2" marker-end="url(#claim-evidence-chain-fig-arr)"/><text x="852" y="222" font-size="16" text-anchor="middle" fill="#525b6b" font-weight="600">tested by</text></g></svg>
