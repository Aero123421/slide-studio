<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="closed-loop-fig-title closed-loop-fig-desc" id="closed-loop-fig" class="ss-fig" direction="ltr" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="closed-loop-fig-title">Causal loops between active users, referrals and support load</title><desc id="closed-loop-fig-desc">Arrows are causal links; + means the two variables move the same way, − the opposite way. R1 (word of mouth): Active users → Referrals → back, 0 negative links, so reinforcing. B1 (slow support, fewer referrals): Active users → Support tickets → Response time → Satisfaction → Referrals → back, 1 negative link, so balancing. B2 (slow support, more churn): Active users → Support tickets → Response time → Satisfaction → Churn → back, 3 negative links, so balancing. Loop type follows from the count of negative links; the diagram makes no claim about strength or timing.</desc><rect x="0" y="0" width="1152" height="470" fill="#1b1a20"/><defs><marker id="closed-loop-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#ece6dc"/></marker><marker id="closed-loop-fig-arr-em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11.7" markerHeight="11.7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#e6864f"/></marker><marker id="closed-loop-fig-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8.1" markerHeight="8.1" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#aaa39a"/></marker><marker id="closed-loop-fig-loop-em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8.1" markerHeight="8.1" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#e6864f"/></marker></defs><path d="M484.4 91.1L474.4 103.5L464.2 115.5L453.7 126.9L443.0 137.9L432.0 148.3L420.8 158.3L409.4 167.7L397.7 176.7L385.8 185.2L373.7 193.1L361.3 200.6L348.7 207.6L335.8 214.1L322.7 220.0L309.4 225.5L295.8 230.5L282.0 235.0L267.9 239.0L253.7 242.5L239.1 245.5L224.4 248.0L209.4 250.0L194.1 251.5L178.6 252.5" fill="none" stroke="#e6864f" stroke-width="3" stroke-linejoin="round" marker-end="url(#closed-loop-fig-arr-em)"/><path d="M135.6 230.9L145.2 219.0L155.0 207.5L165.0 196.5L175.2 186.0L185.6 175.9L196.3 166.2L207.2 157.0L218.3 148.3L229.6 140.0L241.1 132.2L252.9 124.8L264.8 117.9L277.0 111.5L289.4 105.5L302.1 99.9L314.9 94.8L328.0 90.2L341.2 86.0L354.7 82.3L368.5 79.0L382.4 76.2L396.5 73.9L410.9 72.0L425.5 70.5" fill="none" stroke="#e6864f" stroke-width="3" stroke-linejoin="round" marker-end="url(#closed-loop-fig-arr-em)"/><path d="M574.1 70.0L583.2 70.0L592.3 70.0L601.4 70.0L610.5 70.0L619.6 70.0L628.7 70.0L637.8 70.0L646.9 70.0L656.0 70.0L665.1 70.0L674.2 70.0L683.3 70.0L692.5 70.0L701.6 70.0L710.7 70.0L719.8 70.0L728.9 70.0L738.0 70.0L747.1 70.0L756.2 70.0L765.3 70.0L774.4 70.0L783.5 70.0L792.6 70.0" fill="none" stroke="#ece6dc" stroke-width="2" stroke-linejoin="round" marker-end="url(#closed-loop-fig-arr)"/><path d="M914.3 91.0L920.8 95.6L927.3 100.2L933.7 105.0L939.9 109.9L946.0 114.9L952.0 120.0L957.9 125.2L963.7 130.5L969.3 135.9L974.9 141.4L980.3 147.0L985.6 152.8L990.9 158.6L995.9 164.6L1000.9 170.6L1005.8 176.8L1010.6 183.1L1015.2 189.4L1019.7 195.9L1024.1 202.5L1028.4 209.2L1032.6 216.0L1036.7 223.0L1040.7 230.0" fill="none" stroke="#ece6dc" stroke-width="2" stroke-linejoin="round" marker-end="url(#closed-loop-fig-arr)"/><path d="M1037.0 273.4L1031.5 280.8L1025.8 288.1L1020.0 295.2L1014.1 302.2L1008.1 309.0L1002.0 315.6L995.7 322.2L989.3 328.5L982.9 334.8L976.3 340.8L969.6 346.8L962.8 352.6L955.8