<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="common-cause-fig-title common-cause-fig-desc" id="common-cause-fig" class="ss-fig" direction="ltr" font-family="Georgia,&quot;Times New Roman&quot;,&quot;Liberation Serif&quot;,serif,&quot;Hiragino Mincho ProN&quot;,&quot;Noto Serif JP&quot;,&quot;Yu Mincho&quot;,&quot;IPAMincho&quot;,serif" style="overflow:visible;direction:ltr;"><title id="common-cause-fig-title">Common cause: prior attainment drives both app use and scores</title><desc id="common-cause-fig-desc">Causal hypothesis: prior attainment causes both tutoring-app use and end-of-year score; support at home, not measured, may do the same. App users score +8.3 points higher overall, but only +1.1, +0.8 and +1.1 within low, middle and high prior-attainment groups; weighted within groups the difference is +1.0 points (95% CI −1.1 to +3.1).</desc><rect x="0" y="0" width="1152" height="470" fill="#f8f5ee"/><g><defs><marker id="common-cause-fig-dag-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#5f5a51"/></marker><marker id="common-cause-fig-dag-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#1d1b18"/></marker><marker id="common-cause-fig-dag-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#d63a1b"/></marker><marker id="common-cause-fig-dag-arr-open" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#5f5a51" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="ss-edges"><path d="M185.15 222L365.02 222" stroke="#5f5a51" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#common-cause-fig-dag-arr)"/><path d="M248.33 352.65L153.37 262.96" stroke="#5f5a51" stroke-width="1.8" fill="none" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#common-cause-fig-dag-arr)"/><path d="M331.67 352.65L438.26 251.98" stroke="#5f5a51" stroke-width="1.8" fill="none" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#common-cause-fig-dag-arr)"/><path d="M248.33 91.36L153.37 181.04" stroke="#d63a1b" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#common-cause-fig-dag-arr-accent)"/><path d="M331.67 91.36L438.26 192.02" stroke="#d63a1b" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#common-cause-fig-dag-arr-accent)"/></g><g class="ss-node ss-node-process" data-node="prior"><rect x="196.96" y="12.64" width="186.07" height="78.71" rx="10" fill="#d63a1b" stroke="#d63a1b" stroke-width="1.4"/><text x="290" y="44.13" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="600">Prior attainment</text><text x="290" y="66.33" font-size="15" text-anchor="middle" fill="#ffffff">measured</text></g><g class="ss-node ss-node-process" data-node="app"><rect x="34.85" y="184.04" width="150.3" height="75.92" rx="10" fill="#efeadf" stroke="#d8d2c4" stroke-width="1.4"/><text x="110" y="215.52" font-size="18" text-anchor="middle" fill="#1d1b18" font-weight="600"><tspan x="110" y="215.52">Uses the</tspan><tspan x="110" dy="21.96">tutoring app</tspan></text></g><g class="ss-node ss-node-process" data-node="score"><rect x="368.02" y="195.02" width="203.97" height="53.96" rx="10" fill="#efeadf" stroke="#d8d2c4" stroke-width="1.4"/><text x="470" y="226.5" font-size="18" text-anchor="middle" fill="#1d1b18" font-weight="600">End-of-year score</text></g><g class="ss-node ss-node-process" data-node="home"><rect x="193.59" y="352.65" width="192.82" height="78.71" rx="10" fill="#efeadf" stroke="#d8d2c4" stroke-width="1.4" stroke-dasharray="5 4"/><text x="290" y="384.13" font-size="18" text-anchor="middle" fill="#5f5a51" font-weight="600">Support at home</text><text x="290" y="406.33" font-size="15" text-anchor="middle" fill="#5f5a51">not measured</text></g><g class="ss-edge-labels"><g><g class="ss-edge-label"><rect x="119.76" y="122.6" width="162.17" height="27.2" rx="6" fill="#f8f5ee"/><text x="200.85" y="141.96" font-size="16" text-anchor="middle" fill="#d63a1b" font-weight="600">strong readers join</text></g></g><g><g class="ss-edge-label"><rect x="311.33" y="128.09" width="147.27" height="27.2" rx="6" fill="#f8f5ee"/><text x="384.96" y="147.45" font-size="16" text-anchor="middle" fill="#d63a1b" font-weight="600">and score higher</text></g></g><g><g class="ss-edge-label"><rect x="210.9" y="208.4" width="128.37" height="27.2" rx="6" fill="#f8f5ee"/><text x="275.08" y="227.76" font-size="16" text-anchor="middle" fill="#5f5a51" font-weight="600">effect we want</text></g></g></g></g><text x="660" y="27.84" font-size="16" fill="#1d1b18" font-weight="700">App users − non-users, points</text><text x="660" y="51.1" font-size="15" fill="#5f5a51">dot = estimate, line = 95% CI</text><g><line fill="none" x1="874" x2="874" y1="58" y2="396" stroke="#e6e2d7" stroke-width="1"/><text x="874" y="415.1" font-size="15" text-anchor="middle" fill="#5f5a51">−4</text></g><g><line fill="none" x1="939.5" x2="939.5" y1="58" y2="396" stroke="#1d1b18" stroke-width="1.4"/><text x="939.5" y="415.1" font-size="15" text-anchor="middle" fill="#5f5a51">0</text></g><g><line fill="none" x1="1005" x2="1005" y1="58" y2="396" stroke="#e6e2d7" stroke-width="1"/><text x="1005" y="415.1" font-size="15" text-anchor="middle" fill="#5f5a51">+4</text></g><g><line fill="none" x1="1070.5" x2="1070.5" y1="58" y2="396" stroke="#e6e2d7" stroke-width="1"/><text x="1070.5" y="415.1" font-size="15" text-anchor="middle" fill="#5f5a51">+8</text></g><g><line fill="none" x1="1136" x2="1136" y1="58" y2="396" stroke="#e6e2d7" stroke-width="1"/><text x="1136" y="415.1" font-size="15" text-anchor="middle" fill="#5f5a51">+12</text></g><line fill="none" x1="660" x2="1152" y1="129" y2="129" stroke="#d8d2c4"/><line fill="none" x1="660" x2="1152" y1="328" y2="328" stroke="#d8d2c4"/><g><text x="660" y="89.12" font-size="17" fill="#1d1b18" font-weight="700">All students</text><text x="660" y="110.4" font-size="15" fill="#5f5a51">crude</text><line fill="none" x1="1043.25" x2="1108.62" y1="92" y2="92" stroke="#5f5a51" stroke-width="2.5" stroke-linecap="round"/><circle cx="1075.93" cy="92" r="6.5" fill="#f8f5ee" stroke="#5f5a51" stroke-width="2"/><text x="1118.62" y="97.76" font-size="16" fill="#5f5a51" font-weight="700" font-variant-numeric="tabular-nums">+8.3</text></g><g><text x="660" y="172.12" font-size="17" fill="#1d1b18">Low prior attainment</text><line fill="none" x1="891.07" x2="1023.95" y1="166" y2="166" stroke="#1d1b18" stroke-width="1.8" stroke-linecap="round"/><circle cx="957.51" cy="166" r="5" fill="#1d1b18" stroke="#1d1b18" stroke-width="2"/><text x="1033.95" y="171.76" font-size="16" fill="#1d1b18" font-variant-numeric="tabular-nums">+1.1</text></g><g><text x="660" y="234.12" font-size="17" fill="#1d1b18">Middle</text><line fill="none" x1="902.1" x2="1003.1" y1="228" y2="228" stroke="#1d1b18" stroke-width="1.8" stroke-linecap="round"/><circle cx="952.6" cy="228" r="5" fill="#1d1b18" stroke="#1d1b18" stroke-width="2"/><text x="1013.1" y="233.76" font-size="16" fill="#1d1b18" font-variant-numeric="tabular-nums">+0.8</text></g><g><text x="660" y="296.12" font-size="17" fill="#1d1b18">High prior attainment</text><line fill="none" x1="900.1" x2="1014.92" y1="290" y2="290" stroke="#1d1b18" stroke-width="1.8" stroke-linecap="round"/><circle cx="957.51" cy="290" r="5" fill="#1d1b18" stroke="#1d1b18" stroke-width="2"/><text x="1024.92" y="295.76" font-size="16" fill="#1d1b18" font-variant-numeric="tabular-nums">+1.1</text></g><g><text x="660" y="363.12" font-size="17" fill="#1d1b18" font-weight="700">Within groups</text><text x="660" y="384.4" font-size="15" fill="#5f5a51">weighted by group size</text><line fill="none" x1="922.03" x2="989.72" y1="366" y2="366" stroke="#1d1b18" stroke-width="2.5" stroke-linecap="round"/><path d="M955.875 357l9 9l-9 9l-9 -9z" fill="#1d1b18"/><text x="999.72" y="371.76" font-size="16" fill="#1d1b18" font-weight="700" font-variant-numeric="tabular-nums">+1.0</text></g><text x="0" y="468" font-size="15" fill="#5f5a51">Arrows are assumed causes, not findings. Dashed: not measured, so not adjusted for.</text></svg>
