<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="coordinate-frame-fig-title coordinate-frame-fig-desc" id="coordinate-frame-fig" class="ss-fig" direction="ltr" font-family="&quot;Avenir Next&quot;,&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="coordinate-frame-fig-title">Drone body frame: x forward, y right, z down</title><desc id="coordinate-frame-fig-desc">Orthographic view of a quadcopter from behind, right and above, with body axes from the centre of gravity: x forward, y right, z down, a right-handed frame (x × y = z). Arcs show the positive sense of roll, pitch and yaw by the right-hand rule. A logged velocity of (2.0, 1.5, −1.8) m/s is shown as signed components; its z component is −1.8 m/s, which means climbing because z points down.</desc><rect x="0" y="0" width="800" height="470" fill="#e4eaf1"/><defs><marker id="coordinate-frame-fig-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11.7" markerHeight="11.7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#14243a"/></marker><marker id="coordinate-frame-fig-ink-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8.1" markerHeight="8.1" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#14243a"/></marker><marker id="coordinate-frame-fig-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#1c4f9e"/></marker></defs><g><path d="M238 258L385.56 245.24" stroke="#45566b" stroke-width="7" stroke-linecap="round"/><path d="M385.56 245.24L385.56 220.56" stroke="#45566b" stroke-width="4"/><path d="M417.18 195.05L421.16 197