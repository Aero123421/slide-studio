<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 444" width="1152" height="444" role="img" aria-labelledby="decision-tree-fig-title decision-tree-fig-desc" id="decision-tree-fig" class="ss-fig" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="decision-tree-fig-title">Decision tree for summer capacity on the island ferry route, 10-year NPV</title><desc id="decision-tree-fig-desc">A choice between 3 options, each followed by two conditions written on its branches: demand grows (p 0.40) or stays flat (p 0.60). Bars show the 10-year NPV under each condition from a shared zero; the dark tick marks each option&#39;s probability-weighted value. Charter each summer has the highest expected value, €2.5 m against €1.9 m for buy a second vessel, unless the chance of growth exceeds 46%.</desc><rect x="0" y="0" width="1152" height="444" fill="#1c1f24"/><defs><marker id="decision-tree-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#aaaba6"/></marker><marker id="decision-tree-fig-arr-em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11.7" markerHeight="11.7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#c9a45c"/></marker></defs><line x1="951.5" x2="951.5" y1="24" y2="432" stroke="#3b4049" stroke-width="1.4"/><text x="860" y="20" font-size="16" text-anchor="end" fill="#aaaba6" font-weight="600">10-year NPV</text><text x="951.5" y="447.1" font-size="15" text-anchor="middle" fill="#aaaba6">0</text><line x1="1020" x2="1020" y1="2" y2="22" stroke="#e8e5de" stroke-width="2.4" stroke-linecap="round"/><circle cx="1020" cy="12" r="4" fill="#e8e5de"/><text x="1032" y="20" font-size="16