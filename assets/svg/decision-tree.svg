ont-variant-numeric="tabular-nums">+€4.6 m</text><rect x="951.5" y="189" width="94.16" height="22" rx="3" fill="#c9a45c"/><path d="M549.42 230L569.42 230Q579.42 230 579.42 240L579.42 250Q579.42 260 589.42 260L764 260" fill="none" stroke="#aaaba6" stroke-width="1.6"/><text x="595.42" y="252" font-size="17" fill="#e8e5de" font-weight="600">demand flat<tspan fill="#aaaba6" font-weight="400">  p 0.60</tspan></text><text x="860" y="266.48" font-size="18" text-anchor="end" fill="#e8e5de" font-weight="650" font-variant-numeric="tabular-nums">+€1.1 m</text><rect x="951.5" y="249" width="22.52" height="22" rx="3" fill="#c9a45c"/><line x1="1002.67" x2="1002.67" y1="182" y2="278" stroke="#e8e5de" stroke-width="2.4" stroke-linecap="round"/><circle cx="1002.67" cy="230" r="5" fill="#e8e5de" stroke="#1c1f24" stroke-width="2"/><path d="M225.98 230L248.98 230Q260.98 230 260.98 242L260.98 368Q260.98 380 272.98 380L295.98 380" fill="none" stroke="#aaaba6" stroke-width="1.8" marker-end="url(#decision-tree-fig-arr)"/><path d="M549.42 380L569.42 380Q579.42 380 579.42 370L579.42 360Q579.42 350 589.42 350L764 350" fill="none" stroke="#aaaba6" stroke-width="1.6"/><text x="595.42" y="342" font-size="17" fill="#e8e5de" font-weight="600">demand grows<tspan fill="#aaaba6" font-weight="400">  p 0.40</tspan></text><text x="860" y="356.48" font-size="18" text-anchor="end" fill="#e8e5de" font-weight="650" font-variant-numeric="tabular-nums">−€2.5 m</text><rect x="900.33" y="339" width="51.17" height="22" rx="3" fill="#5c616b"/><path d="M549.42 380L569.42 380Q579.42 380 579.42 390L579.42 400Q579.42 410 589.42 410L764 410" fill="none" stroke="#aaaba6" stroke-width="1.6"/><text x="595.42" y="402" font-size="17" fill="#e8e5de" font-weight="600">demand flat<tspan fill="#aaaba6" font-weight="400">  p 0.60</tspan></text><text x="860" y="416.48" font-size="18" text-anchor="end" fill="#e8e5de" font-weight="650" font-variant-numeric="tabular-nums">€0.0 m</text><line x1="931.03" x2="931.03" y1="332" y2="428"