<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 444" width="1152" height="444" role="img" aria-labelledby="dependency-dag-fig-title dependency-dag-fig-desc" id="dependency-dag-fig" class="ss-fig" direction="ltr" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="dependency-dag-fig-title">Release 5.2 task dependencies with the critical path</title><desc id="dependency-dag-fig-desc">9 tasks. An arrow means the first task must finish before the second can start; tasks in the same column have no dependency on each other and can run in parallel. The critical path (Branch cut → API v3 migration → Regression QA → Store review → Staged rollout) takes 18 working days; ios build has 4 days of slack, android build has 5 days of slack, translations has 3 days of slack, store screenshots has 3 days of slack.</desc><rect x="0" y="0" width="1152" height="444" fill="#faf8f5"/><defs><marker id="dependency-dag-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#5d5869"/></marker><marker id="dependency-dag-fig-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#221f2c"/></marker><marker id="dependency-dag-fig-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#5a3ec2"/></marker><marker id="dependency-dag-fig-arr-open" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L