<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="experimental-assignment-fig-title experimental-assignment-fig-desc" id="experimental-assignment-fig" class="ss-fig" font-family="Georgia,&quot;Times New Roman&quot;,&quot;Liberation Serif&quot;,serif,&quot;Hiragino Mincho ProN&quot;,&quot;Noto Serif JP&quot;,&quot;Yu Mincho&quot;,&quot;IPAMincho&quot;,serif" style="overflow:visible;"><title id="experimental-assignment-fig-title">割付を独立した手順として示すタイムラインと割付リスト</title><desc id="experimental-assignment-fig-desc">適格性の確認（第-10〜-4週）、割付（第-3週）、介入（第1〜12週）、測定（第14週）を実際の週で並べた。割付は地区で層別した置換ブロック法で、北地区16校、中央地区20校、南地区12校をそれぞれ半数ずつに分け、合計48校を補習群24校と対照群24校にした。乱数列は外部の統計担当者が作成し、48校の登録が終わってから開示。</desc><rect x="0" y="0" width="1152" height="470" fill="#f7f2e8"/><g><line fill="none" x1="14" x2="1138" y1="92" y2="92" stroke="#d6cdb9" stroke-width="1.5"/><g><line fill="none" x1="57.23" x2="57.23" y1="92" y2="97" stroke="#d6cdb9"/><text x="57.23" y="114.1" font-size="15" text-anchor="middle" fill="#4e5568">−10</text></g><g><line fill="none" x1="143.69" x2="143.69" y1="92" y2="97" stroke="#d6cdb9"/><text x="143.69" y="114.1" font-size="15" text-anchor="middle" fill="#4e5568">−8</text></g><g><line fill="none" x1="230.15" x2="230.15" y1="92" y2="97" stroke="#d6cdb9"/><text x="230.15" y="114.1" font-size="15" text-anchor="middle" fill="#4e5568">−6</text></g><g><line fill="none" x1="316.62" x2="316.62" y1="92" y2="97" stroke="#d6cdb9"/><text x="316.62" y="114.1" font-size="15" text-anchor="middle" fill="#4e5568">−4</text></g><g><line fill="none" x1="403.08" x2="403.08" y1="92" y2="97" stroke="#d6cdb9"/><text x="403.08" y="114.1" font-size="15" text-anchor="middle" fill="#4e5568">−2</text></g><g><line fill="none" x1="489.54" x2="489.54" y1="92" y2="97" stroke="#d6cdb9"/><text x="489.54" y="114.1" font-size="15" text-anchor="middle" fill="#4e5568">0</text></g><g><line fill="none" x1="576" x2="576" y1="92" y2="97" stroke="#d6cdb9"/><text x="5