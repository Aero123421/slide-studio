<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="exploded-assembly-fig-title exploded-assembly-fig-desc" id="exploded-assembly-fig" class="ss-fig" font-family="&quot;Times New Roman&quot;,Times,Georgia,&quot;Liberation Serif&quot;,serif,&quot;Hiragino Mincho ProN&quot;,&quot;Noto Serif JP&quot;,&quot;Yu Mincho&quot;,&quot;IPAMincho&quot;,serif" style="overflow:visible;"><title id="exploded-assembly-fig-title">Exploded view of a seven-part sensor housing on one axis</title><desc id="exploded-assembly-fig-desc">Seven parts, numbered in assembly order from the base shell up to the top cap, drawn to scale on one vertical axis and separated by 13 mm for clarity. five parts carry a key slot 15 mm from the axis at the same angle, so the slots line up on one registration line. Assembled stack height 54.6 mm. The O-ring is replaced at every opening.</desc><rect x="0" y="0" width="1152" height="470" fill="#ffffff"/><line fill="none" x1="340" x2="340" y1="19.61" y2="466" stroke="#505050" stroke-width="1" stroke-dasharray="16 4 3 4"/><g data-part="1"><path d="M232 385.8594385949607A108 29.76883442823591 0 0 0 448 385.8594385949607L448 432A108 29.76883442823591 0 0 1 232 432Z" fill="#c8c8c8" stroke="#161616" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="340" cy="385.86" rx="108" ry="29.77" fill="#efefed" stroke="#161616" stroke-width="1.5"/><ellipse cx="374.47" cy="393.83" rx="6" ry="3.31" fill="#9b2d1f"/></g><g data-part="2"><path d="M241 341.16076973382883A99 27.288098225882916 0 0 0 439 341.16076973382883L439 348.37023245336627A99 27.288098225882916 0 0 1 241 348.37023245336627Z" fill="#c8c8c8" stroke="#161616" stroke-width="1.5" stroke-linejoin="round"/><path d="M241 341.16076973382883a99 27.288098225882916 0 1 0 198 0a99 27.288098225882916 0 1 0 -198 0ZM253 341.16076973382883a87 23.980449956078928 0 1 0 174 0a87 23.980449956078928 0 1 0 -174 0Z" fill="#efefed" fill-rule="evenodd" stroke="#161616"