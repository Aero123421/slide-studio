data-part="7"><path d="M232 49.6100973557368A108 29.76883442823591 0 0 0 448 49.6100973557368L448 89.98308858514616A108 29.76883442823591 0 0 1 232 89.98308858514616Z" fill="#c8c8c8" stroke="#161616" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="340" cy="49.61" rx="108" ry="29.77" fill="#efefed" stroke="#161616" stroke-width="1.5"/><ellipse cx="340" cy="49.61" rx="9" ry="2.48" fill="#161616"/><ellipse cx="374.47" cy="57.58" rx="6" ry="3.31" fill="#9b2d1f"/></g><line fill="none" x1="374.47" x2="374.47" y1="23.58" y2="397.83" stroke="#9b2d1f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="382.47" y="17.58" font-size="15" fill="#9b2d1f" font-weight="700">one key slot, 15 mm off axis</text><text x="576" y="468" font-size="15" fill="#505050">Parts to scale; the 13 mm gaps between them are not.</text><g><path d="M456 408.92971929748035H530L550 408.92971929748035H574" fill="none" stroke="#505050" stroke-width="1"/><circle cx="590" cy="408.93" r="14" fill="#ffffff" stroke="#161616" stroke-width="1.5"/><text x="590" y="414.69" font-size="16" text-anchor="middle" fill="#161616" font-weight="700">1</text><text x="616" y="405.05" font-size="17" fill="#161616" font-weight="700">Base shell</text><text x="616" y="426.33" font-size="15" fill="#505050">PC/ASA, Ø72 × 16 mm</text></g><g><path d="M447 344.76550109359755H530L550 344.76550109359755H574" fill="none" stroke="#505050" stroke-width="1"/><circle cx="590" cy="344.77" r="14" fill="#ffffff" stroke="#161616" stroke-width="1.5"/><text x="590" y="350.53" font-size="16" text-anchor="middle" fill="#161616" font-weight="700">2</text><text x="616" y="340.89" font-size="17" fill="#161616" font-weight="700">O-ring seal</text><text x="616" y="362.17" font-size="15" fill="#505050">EPDM, Ø66 × 2.5 mm; replace at every opening</text></g><g><path d="M441 286.3688530653447H530L550 286.3688530653447H574" fill="none" stroke="#505050" stroke-width="1"/><circle cx="590" cy="286.37" r="14" fill="#ffffff" stroke="#161616" stroke-widt