<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="funnel-fig-title funnel-fig-desc" id="funnel-fig" class="ss-fig" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="funnel-fig-title">Applications remaining at each stage of the 2026 community health fund round</title><desc id="funnel-fig-desc">Bar width is proportional to the number of applications at each stage; at the eligibility screen, the accent wings show the width that was lost. 1,240 letters of intent became 31 grants (2.5%). The largest cut is the eligibility screen: 828 letters stop there, 33% continue; all later stages together remove 381.</desc><rect x="0" y="0" width="800" height="470" fill="#fbf6ec"/><rect x="232.08" y="9.95" width="417.92" height="55.28" rx="4" fill="#cfc4b0"/><text x="441.04" y="44.43" font-size="19" text-anchor="middle" fill="#3a2a20" font-weight="700" font-variant-numeric="tabular-nums">1,240</text><text x="218.08" y="44.07" font-size="18" text-anchor="end" fill="#3a2a20" font-weight="600">Letters of intent</text><rect x="371.61" y="88.91" width="138.86" height="55.28" rx="4" fill="#cfc4b0"/><text x="441.04" y="123.39" font-size="19" text-anchor="middle" fill="#3a2a20" font-weight="700" font-variant-numeric="tabular-nums">412</text><text x="218.08" y="123.03" font-size="18" text-anchor="end" fill="#3a2a20" font-weight="600">Pass eligibility screen</text><text x="666" y="82.83" font-size="16" fill="#6b5a4c" font-weight="600">33% continue</text><path d="M656 69.07l0 16" stroke="#e0d4bf" stroke-width="1.5"/><rect x="409.69" y="167.88" width="62.69" height="55.28" rx="4" fill="#cfc4b0"/><text x="441.04" y="202.36" font-size="19" text-anchor="middle" fill="#3a2a20" font-weight="700" font-variant-numeric="tabular-nums">186</text><text x="218.08" y="202" font-size="18" text-anchor="end" fill="#3a2a20" font-weight="600">Invited to full proposal</text><text x="666" y="161.79" font-size="16" fill="#6b5a4c" font-weight="600">45% continue</text><path d="M656 148.03l0 16" stroke="#e0d4bf" stroke-width="1.5"/><rect x="412.22" y="246.84" width="57.63" height="55.28" rx="4" fill="#cfc4b0"/><text x="479.86" y="281.32" font-size="19" fill="#3a2a20" font-weight="700" font-variant-numeric="tabular-nums">171</text><text x="218.08" y="280.96" font-size="18" text-anchor="end" fill="#3a2a20" font-weight="600">Full proposal submitted</text><text x="666" y="240.76" font-size="16" fill="#6b5a4c" font-weight="600">92% continue</text><path d="M656 227l0 16" stroke="#e0d4bf" stroke-width="1.5"/><rect x="431.26" y="325.81" width="19.55" height="55.28" rx="4" fill="#cfc4b0"/><text x="460.81" y="360.29" font-size="19" fill="#3a2a20" font-weight="700" font-variant-numeric="tabular-nums">58</text><text x="218.08" y="359.93" font-size="18" text-anchor="end" fill="#3a2a20" font-weight="600">Site visit</text><text x="666" y="319.73" font-size="16" fill="#6b5a4c" font-weight="600">34% continue</text><path d="M656 305.97l0 16" stroke="#e0d4bf" stroke-width="1.5"/><rect x="435.81" y="404.78" width="10.45" height="55.28" rx="4" fill="#cfc4b0"/><text x="456.26" y="439.25" font-size="19" fill="#3a2a20" font-weight="700" font-variant-numeric="tabular-nums">31</text><text x="218.08" y="438.89" font-size="18" text-anchor="end" fill="#3a2a20" font-weight="600">Funded</text><text x="666" y="398.69" font-size="16" fill="#6b5a4c" font-weight="600">53% continue</text><path d="M656 384.93l0 16" stroke="#e0d4bf" stroke-width="1.5"/><g class="funnel-cut"><rect x="232.08" y="88.91" width="136.53" height="55.28" rx="4" fill="#b5502a"/><rect x="513.47" y="88.91" width="136.53" height="55.28" rx="4" fill="#b5502a"/><text x="300.34" y="122.31" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="700">828 stopped