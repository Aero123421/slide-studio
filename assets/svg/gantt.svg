<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="gantt-fig-title gantt-fig-desc" id="gantt-fig" class="ss-fig" font-family="Arial,&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,sans-serif,&quot;BIZ UDPGothic&quot;,&quot;Meiryo&quot;,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="gantt-fig-title">充填ラインの段取り替え：作業ごとの開始と終了（停止からの経過分）</title><desc id="gantt-fig-desc">ライン停止から量産再開まで82分。洗浄と検査の連鎖（CIP洗浄→ふき取り検査）が52分を占める。機械班のチェンジパーツ交換とラベラーの調整（計50分）はCIP洗浄の時間内に収まり、停止時間を延ばしていない。横軸は実時間で、棒の左端は開始時刻を含み、右端は終了時刻を含まない。</desc><rect x="0" y="0" width="1152" height="470" fill="#f6f7f5"/><line x1="199" x2="199" y1="32" y2="460" stroke="#dee2de"/><text x="205" y="26" font-size="17" fill="#4b5450">0分</text><line x1="302.67" x2="302.67" y1="32" y2="460" stroke="#dee2de"/><text x="308.67" y="26" font-size="17" fill="#4b5450">10分</text><line x1="406.33" x2="406.33" y1="32" y2="460" stroke="#dee2de"/><text x="412.33" y="26" font-size="17" fill="#4b5450">20分</text><line x1="510" x2="510" y1="32" y2="460" stroke="#dee2de"/><text x="516" y="26" font-size="17" fill="#4b5450">30分</text><line x1="613.67" x2="613.67" y1="32" y2="460" stroke="#dee2de"/><text x="619.67" y="26" font-size="17" fill="#4b5450">40分</text><line x1="717.33" x2="717.33" y1="32" y2="460" stroke="#dee2de"/><text x="723.33" y="26" font-size="17" fill="#4b5450">50分</text><line x1="821" x2="821" y1="32" y2="460" stroke="#dee2de"/><text x="827" y="26" font-size="17" fill="#4b5450">60分</text><line x1="924.67" x2="924.67" y1="32" y2="460" stroke="#dee2de"/><text x="930.67" y="26" font-size="17" fill="#4b5450">70分</text><line x1="1028.33" x2="1028.33" y1="32" y2="460" stroke="#dee2de"/><text x="1034.33" y="26" font-size="17" fill="#4b5450">80分</text><line x1="1132" x2="1132" y1="32" y2="460" stroke="#dee2de"/><text x="1138" y="26" font-size="17" fill="#4b5450">90分</text><rect x="199" y="49.16" width="124.4" height="35.41" rx="6" fill="#c1c8c8"/><text x="331.4" y="72.98" font-size="17" fill="#4b5450">全員</text><text x="183" y="73.7" font-size="19" text-anchor="end" fill="#1d2320">停止・残液回収</text><rect x="323.4" y="110.2" width="414.67" height="35.41" rx="6" fill="#2e4a5a"/><text x="746.07" y="134.03" font-size="17" fill="#4b5450">洗浄班</text><text x="183" y="134.75" font-size="19" text-anchor="end" fill="#1d2320">CIP洗浄</text><rect x="323.4" y="171.25" width="269.53" height="35.41" rx="6" fill="#c1c8c8"/><text x="600.93" y="195.07" font-size="17" fill="#4b5450">機械班</text><text x="183" y="195.79" font-size="19" text-anchor="end" fill="#1d2320">チェンジパーツ交換</text><rect x="427.07" y="232.3" width="248.8" height="35.41" rx="6" fill="#c1c8c8"/><text x="683.87" y="256.12" font-size="17" fill="#4b5450">機械班</text><text x="183" y="256.84" font-size="19" text-anchor="end" fill="#1d2320">ラベラーの調整</text><rect x="738.07" y="293.34" width="124.4" height="35.41" rx="6" fill="#2e4a5a"/><text x="870.47" y="317.17" font-size="17" fill="#4b5450">品質班</text><text x="183" y="317.89" font-size="19" text-anchor="end" fill="#1d2320">ふき取り検査</text><rect x="862.47" y="354.39" width="186.6" height="35.41" rx="6" fill="#c1c8c8"/><text x="1057.07" y="378.21" font-size="17" fill="#4b5450">品質班</text><text x="183" y="378.93" font-size="19" text-anchor="end" fill="#1d2320">試運転・初品検査</text><path d="M1049.07 413.67L1068.54 433.14L1049.07 452.61L1029.59 433.14Z" fill="#1d2320"/><text x="1076.54" y="439.26" font-size="17" fill="#1d2320" font-weight="600">82分</text><text x="183" y="439.98" font-size="19" text-anchor="end" fill="#1d2320" font-weight="700">量産再開</text><g class="ss-callout"><circle cx="675.87" cy="250" r="4.5" fill="#1d2320" stroke="#f6f7f5" stroke-width="2"/><path d="M675.87 250V400H641.87" fill="none" stroke="#4b5450" stroke-width="1.3"/><text x="635.87" y="394.78" font-size="18" text-anchor="end" fill="#1d2320" stroke="#f6f7f5" stroke-width="5.04" stroke-linejoin="round" paint-order="stroke"><tspan x="635.87" y="394.78">機械班の2作業（計50分）は、</tspan><tspan x="635.87" dy="23.4">CIP洗浄の40分の内側で終わる</tspan></text></g></svg>
