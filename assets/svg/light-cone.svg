</tspan></text><path d="M894 464h6V636h-6" fill="none" stroke="#aaaba6" stroke-width="1.2"/><text x="910" y="555" font-size="16" fill="#aaaba6"><tspan font-weight="700">30%</tspan><tspan dx="6">eight other markets</tspan></text></svg>
