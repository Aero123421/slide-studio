<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 450" width="1152" height="450" role="img" aria-labelledby="lollipop-fig-title lollipop-fig-desc" id="lollipop-fig" class="ss-fig" direction="ltr" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="lollipop-fig-title">Usable observing nights per year at twelve candidate telescope sites</title><desc id="lollipop-fig-desc">4 of 12 sites reach the 220 usable nights a year the survey needs: Mesa Escondida (296), Altiplano Station (271), Cuesta Larga (248), Valle Seco (233). The rest fall short, down to 97 at Lakeside Hill.</desc><rect x="0" y="0" width="1152" height="450" fill="#0e1320"/><g class="ss-lolli"><line x1="173.24" x2="1100.15" y1="26.08" y2="26.08" stroke="#d2ab52" stroke-width="2.5"/><circle cx="1100.15" cy="26.08" r="9" fill="#d2ab52"/></g><text x="159.24" y="32.2" font-size="17" text-anchor="end" fill="#e7e3d8" font-weight="700">Mesa Escondida</text><text x="1116.15" y="31.84" font-size="16" fill="#e7e3d8" font-weight="700" font-variant-numeric="tabular-nums">296</text><g class="ss-lolli"><line x1="173.24" x2="1021.87" y1="62.25" y2="62.25" stroke="#d2ab52" stroke-width="2.5"/><circle cx="1021.87" cy="62.25" r="9" fill="#d2ab52"/></g><text x="159.24" y="68.37" font-size="17" text-anchor="end" fill="#e7e3d8" font-weight="700">Altiplano Station</text><text x="1037.87" y="68.01" font-size="16" fill="#e7e3d8" font-weight="700" font-variant-numeric="tabular-nums">271</text><g class="ss-lolli"><line x1="173.24" x2="949.84" y1="98.42" y2="98.42" stroke="#d2ab52" stroke-width="2.5"/><circle cx="949.84" cy="98.42" r="9" fill="#d2ab52"/></g><text x="159.24" y="104.54" font-size="17" text-anchor="end" fill="#e7e3d8" font-weight="700">Cuesta Larga</text><text x="965.84" y="104.18" fo