<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 444" width="1152" height="444" role="img" aria-labelledby="nested-boundary-fig-title nested-boundary-fig-desc" id="nested-boundary-fig" class="ss-fig" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="nested-boundary-fig-title">カード情報の監査範囲：システムの所属と、トークン化による移動</title><desc id="nested-boundary-fig-desc">入れ子の枠は所属を表す。社内ネットワークの中に監査範囲があり、その中にトークン保管庫がある。枠の内側にあるシステムだけが監査の対象。トークン化で分析基盤と顧客サポートが監査範囲の外に移り、対象は9から7システムに減った。点線の箱は移動前の位置、矢印は境界をまたいだ移動を示す。</desc><rect x="0" y="0" width="1152" height="444" fill="#fafafa"/><defs><marker id="nested-boundary-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#1c1f26"/></marker></defs><path d="M17 1H1135Q1151 1 1151 17V427Q1151 443 1135 443H17Q1 443 1 427V17Q1 1 17 1Z" fill="#eff0f2" stroke="#cfd2d8" stroke-width="1.6"/><text x="21" y="31.06" font-size="19" fill="#1c1f26" font-weight="700">社内ネットワーク</text><path d="M462 52H1114Q1130 52 1130 68V406Q1130 422 1114 422H462Q446 422 446 406V68Q446 52 462 52Z" fill="#fafafa" stroke="#8f2a22" stroke-width="3"/><text x="466" y="82.06" font-size="19" fill="#8f2a22" font-weight="700">監査範囲</text><text x="466" y="105.1" font-size="15" fill="#4e535d">カード番号に触れる</text><path d="M924 114H1092Q1108 114 1108 130V384Q1108 400 1092 400H924Q908 400 908 384V130Q908 114 924 114Z" fill="#fafafa" stroke="#cfd2d8" stroke-width="1.6"/><text x="928" y="144.06" font-size="19" fill="#1c1f26" font-weight="700">トークン保管庫</text><text x="928" y="167.1" font-size="15" fill="#4e535d">カード番号はここだけ</text><path d="M478 183H659Q669 183 669 193V238Q669 248 659 248H478Q468 248 468 238V193Q468 183 478 183Z" fill="none" stroke="#4e535d" stroke-width="1.4" stroke-dasharray="5 5"/><text x="568.5" y="221.26" font-size="16" text-anchor="middle" fill="#4e535d">分析基盤（以前）</text><path d="M464 215.5H432" fill="none" stroke="#1c1f26" stroke-width="1.8" marker-end="url(#nested-boundary-fig-arr)"/><path d="M478 262H659Q669 262 669 272V317Q669 327 659 327H478Q468 327 468 317V272Q468 262 478 262Z" fill="none" stroke="#4e535d" stroke-width="1.4" stroke-dasharray="5 5"/><text x="568.5" y="300.26" font-size="16" text-anchor="middle" fill="#4e535d">顧客サポート（以前）</text><path d="M464 294.5H432" fill="none" stroke="#1c1f26" stroke-width="1.8" marker-end="url(#nested-boundary-fig-arr)"/><g class="ss-node ss-node-process"><rect x="22" y="70" width="194" height="66" rx="10" fill="#fafafa" stroke="#cfd2d8" stroke-width="1.4"/><text x="119" y="107.5" font-size="18" text-anchor="middle" fill="#1c1f26" font-weight="600">会計システム</text></g><g class="ss-node ss-node-process"><rect x="22" y="150" width="194" height="66" rx="10" fill="#fafafa" stroke="#cfd2d8" stroke-width="1.4"/><text x="119" y="187.5" font-size="18" text-anchor="middle" fill="#1c1f26" font-weight="600">人事システム</text></g><g class="ss-node ss-node-process"><rect x="22" y="230" width="194" height="66" rx="10" fill="#fafafa" stroke="#cfd2d8" stroke-width="1.4"/><text x="119" y="267.5" font-size="18" text-anchor="middle" fill="#1c1f26" font-weight="600">社内メール</text></g><g class="ss-node ss-node-process"><rect x="232" y="150" width="194" height="66" rx="10" fill="#fafafa" stroke="#cfd2d8" stroke-width="1.4"/><text x="329" y="175.13" font-size="18" text-anchor="middle" fill="#1c1f26" font-weight="600">分析基盤</text><text x="329" y="197.33" font-size="15" text-anchor="middle" fill="#4e535d">トークンだけ受け取る</text></g><g class="ss-node ss-node-process"><rect x="232" y="230" width="194" height="66" rx="10" fill="#fafafa" stroke="#cfd2d8" stroke-width="1.4"/><text x="329" y="255.13" font-size="18" text-anchor="middle" fill="#1c1f26" font-weight="600">顧客サポート</text><text x="329" y="277.33" font-s