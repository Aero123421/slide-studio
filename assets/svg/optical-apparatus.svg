<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="optical-apparatus-fig-title optical-apparatus-fig-desc" id="optical-apparatus-fig" class="ss-fig" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="optical-apparatus-fig-title">Absorbance bench: LED, collimating lens, iris, cuvette, focusing lens and photodiode on one axis</title><desc id="optical-apparatus-fig-desc">Rays leave the LED within ±7°, become parallel after the 40 mm lens, and the 8 mm iris passes only rays within ±5.7°. The 8 mm parallel beam crosses the 10 mm sample path and the 50 mm lens focuses it on the photodiode. Absorbance 0.50 leaves 32% of the light. Axial positions to scale; heights doubled.</desc><rect x="0" y="0" width="1152" height="470" fill="#f2f4f0"/><defs><marker id="optical-apparatus-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#1e5f8c"/></marker></defs><line fill="none" x1="-2.8" x2="1110" y1="236" y2="236" stroke="#3f474b" stroke-width="1" stroke-dasharray="14 4 2 4"/><path d="M70 236L278 194.4L278 277.6L70 236Z" fill="#1e5f8c" fill-opacity="0.22"/><path d="M278 194.4L544.5 194.4L544.5 277.6L278 277.6Z" fill="#1e5f8c" fill-opacity="0.22"/><path d="M544.5 194.4L549.7 194.4L549.7 277.6L544.5 277.6Z" fill="#1e5f8c" fill-opacity="0.21"/><path d="M549.7 194.4L554.9000000000001 194.4L554.9000000000001 277.6L549.7 277.6Z" fill="#1e5f8c" fill-opacity="0.19"/><path d="M554.9000000000001 194.4L560.1 194.4L560.1 277.6L554.9000000000001 277.6Z" fill="#1e5f8c" fill-opacity="0.16"/><path d="M560.1 194.4L565.3 194.4L565.3 277.6L560.1 277.6Z" fill="#1e5f8c" fill-opacity="0.15"/><path d="M565.3