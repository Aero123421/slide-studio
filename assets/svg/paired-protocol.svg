<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="paired-protocol-fig-title paired-protocol-fig-desc" id="paired-protocol-fig" class="ss-fig" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="paired-protocol-fig-title">Two-period crossover: matched measurement windows across two sequences</title><desc id="paired-protocol-fig-desc">Both sequences follow the same schedule on a true day axis: 7-day run-in, 28-day diet period, 14-day washout, second 28-day period. Only the last 7 days of each period are compared (14 of 77 days). Low-sodium minus usual: −6.7 mmHg in sequence 1 and −4.7 in sequence 2; crossover estimate −5.7 mmHg.</desc><rect x="0" y="0" width="1152" height="470" fill="#ffffff"/><g><rect x="186.43" y="74" width="73.01" height="282" fill="#f2f5f8" stroke="none" stroke-width="1.2" stroke-dasharray="4 3"/><text x="186.43" y="64" font-size="15" fill="#4f5d6b">Baseline, days −7 to −1</text></g><g><rect x="478.48" y="74" width="73.01" height="282" fill="#c4d8ee" stroke="#1d5fa6" stroke-width="1.2" stroke-dasharray="4 3"/><text x="551.49" y="64" font-size="15" text-anchor="end" fill="#1d5fa6" font-weight="700">Final week, days 22–28</text></g><g><rect x="916.56" y="74" width="73.01" height="282" fill="#c4d8ee" stroke="#1d5fa6" stroke-width="1.2" stroke-dasharray="4 3"/><text x="989.57" y="64" font-size="15" text-anchor="end" fill="#1d5fa6" font-weight="700">Final week, days 64–70</text></g><g><text x="0" y="145.48" font-size="18" fill="#1b2733" font-weight="700">Sequence 1</text><text x="0" y="168.4" font-size="15" fill="#4f5d6b">n = 22, low sodium first</text><g><rect x="186.43" y="125" width="73.01" height="50" rx="4" fill="#ffffff" stroke="#d5dce3" stroke-width="1.5"/><text x="