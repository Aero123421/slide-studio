<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="pipeline-fig-title pipeline-fig-desc" id="pipeline-fig" class="ss-fig" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="pipeline-fig-title">Data pipeline from raw sensor logs to an hourly failure score</title><desc id="pipeline-fig-desc">Five stages in sequence: raw logs are deduplicated, clock-aligned and windowed before scoring. A dashed branch sends malformed rows to quarantine. Arrows mean data flow, not time or causation.</desc><rect x="0" y="0" width="1152" height="420" fill="#ffffff"/><defs><marker id="pipeline-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#525b6b"/></marker><marker id="pipeline-fig-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#1a1f2b"/></marker><marker id="pipeline-fig-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#c2286e"/></marker><marker id="pipeline-fig-arr-open" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#525b6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="ss-edges"><path d="M181.2 216.1L208.81 216.1" stroke="#525b6b" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#pipeline-fig-arr)"/><path d="M412.06 216.1L441.66 216.1Q453.66 216.1 453.66 204.1L453.66 171.28Q453.66 159.28 465.66 159.28L547.72 159.28" stroke="#525b6b" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#pipeline-fig-arr)"/><path d="M412.06 216.1L441.66 216.1Q453.66 216.1 453.66 228.1L453.66 260.93Q453.66 272.93 465.66 272.93L552.49 272.93" stroke="#525b6b" stroke-width="1.8" fill="none" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#pipeline-fig-arr)"/><path d="M732.43 159.28L760.04 159.28" stroke="#c2286e" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#pipeline-fig-arr-accent)"/><path d="M926.19 159.28L953.8 159.28" stroke="#c2286e" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#pipeline-fig-arr-accent)"/></g><g class="ss-node ss-node-store" data-node="raw"><g><path d="M4 165.07V267.12A88.6 9 0 0 0 181.2 267.12V165.07" fill="#f3f4f7" stroke="#d7dbe2" stroke-width="1.4"/><ellipse cx="92.6" cy="165.07" rx="88.6" ry="9" fill="#f3f4f7" stroke="#d7dbe2" stroke-width="1.4"/></g><text x="92.6" y="195.27" font-size="20" text-anchor="middle" fill="#1a1f2b" font-weight="600"><tspan x="92.6" y="195.27">Raw</tspan><tspan x="92.6" dy="24.4">sensor logs</tspan></text><text x="92.6" y="244.03" font-size="17" text-anchor="middle" fill="#525b6b">2.1 B rows / day</text></g><g class="ss-node ss-node-process" data-node="clean"><rect x="211.81" y="174.27" width="200.25" height="83.65" rx="10" fill="#f3f4f7" stroke="#d7dbe2" stroke-width="1.4"/><text x="311.94" y="207.47" font-size="20" text-anchor="middle" fill="#1a1f2b" font-weight="600">Deduplicate</text><text x="311.94" y="231.83" font-size="17" text-anchor="middle" fill="#525b6b">drops 3.4% repeats</text></g><g class="ss-node ss-node-process" data-node="align"><rect x="550.72" y="117.45" width="181.71" height="83.65" rx="10" fill="#f3f4f7" stroke="#d7dbe2" stroke-width="1.4"/><text x="641.57" y="150.65" font-size="20" text-anchor="middle" fill="#1a1f2b" font-weight="600">Align clocks</text><text x="641.57" y="175.01" font-size="17" text-anchor="middle" fill="#525b6b">±40 ms drift fixed</text></g><g class="ss-node ss-node-process" data-node="window"><rect x="763.04" y="105.25" width="163.15" height="108.05" rx="10" fill="#c2286e" stroke="#c2286e" stroke-width="1.4"/><text x="844.61" y="138.45" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="600"><tspan x="844.61" y="138.45">Window</tspan><tspan x="844.61" dy="24.4">features</tspan></text><text x="844.61" y="187.21" font-size="17" text-anchor="middle" fill="#ffffff">5-min windows</text></g><g class="ss-node ss-node-terminal" data-node="score"><rect x="956.8" y="117.45" width="191.2" height="83.65" rx="41.83" fill="#f3f4f7" stroke="#d7dbe2" stroke-width="1.4"/><text x="1052.4" y="150.65" font-size="20" text-anchor="middle" fill="#1a1f2b" font-weight="600">Failure score</text><text x="1052.4" y="175.01" font-size="17" text-anchor="middle" fill="#525b6b">per pump, hourly</text></g><g class="ss-node ss-node-process" data-node="hold"><rect x="555.49" y="231.1" width="172.16" height="83.65" rx="10" fill="#f3f4f7" stroke="#d7dbe2" stroke-width="1.4" stroke-dasharray="5 4"/><text x="641.57" y="264.3" font-size="20" text-anchor="middle" fill="#525b6b" font-weight="600">Quarantine</text><text x="641.57" y="288.66" font-size="17" text-anchor="middle" fill="#525b6b">malformed rows</text></g><g class="ss-edge-labels"><g><g class="ss-edge-label"><rect x="434.54" y="258.13" width="137.07" height="29.6" rx="6" fill="#ffffff"/><text x="503.08" y="279.41" font-size="18" text-anchor="middle" fill="#525b6b" font-weight="600">0.2% rejected</text></g></g></g></svg>
