<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 456" width="1152" height="456" role="img" aria-labelledby="quadrant-fig-title quadrant-fig-desc" id="quadrant-fig" class="ss-fig" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="quadrant-fig-title">Application portfolio by business value and technical health, panel scores 1 to 5</title><desc id="quadrant-fig-desc">Positions are median scores from a review panel, judgments rather than measurements. 4 of 12 applications score above 3 on value and below 3 on health: Order management, Billing engine, Warehouse scanning, Payroll.</desc><rect x="0" y="0" width="1152" height="456" fill="#1c1f24"/><rect x="72" y="2" width="536" height="197" fill="#c9a45c" fill-opacity="0.13"/><line x1="608" x2="608" y1="2" y2="396" stroke="#aaaba6" stroke-width="1.2"/><line x1="72" x2="1144" y1="199" y2="199" stroke="#aaaba6" stroke-width="1.2"/><line x1="72" x2="1144" y1="396" y2="396" stroke="#3b4049" stroke-width="1.5"/><line x1="72" x2="72" y1="2" y2="396" stroke="#3b4049" stroke-width="1.5"/><g><text x="88" y="27.82" font-size="17" fill="#c9a45c" font-weight="700">Migrate</text><text x="161.38" y="27.1" font-size="15" fill="#aaaba6">valuable but fragile</text></g><g><text x="929.39" y="27.82" font-size="17" fill="#e8e5de" font-weight="700">Invest</text><text x="990.12" y="27.1" font-size="15" fill="#aaaba6">valuable and sound</text></g><g><text x="88" y="382.42" font-size="17" fill="#e8e5de" font-weight="700">Retire</text><text x="148.7" y="381.7" font-size="15" fill="#aaaba6">fragile, little value</text></g><g><text x="925.42" y="382.42" font-size="17" fill="#e8e5de" font-weight="700">Tolerate</text><text x="1005.16" y="381.7" font-size="15" fill="#aaaba6">sound, little value</text></g><g><text x="179.2" y="41