<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="randomized-arms-fig-title randomized-arms-fig-desc" id="randomized-arms-fig" class="ss-fig" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="randomized-arms-fig-title">Randomized trial flow: text reminders versus usual care for second-dose completion</title><desc id="randomized-arms-fig-desc">1,204 adults assessed, 388 excluded, 816 randomized 1:1 by a computer-generated list in blocks of 4, stratified by clinic. Text reminders: 275 of 387 completed (71.1%). Usual care: 221 of 382 (57.9%). Difference 13.2 percentage points, 95% CI 6.5 to 19.9. Arrows show the flow of participants.</desc><rect x="0" y="0" width="1152" height="470" fill="#ffffff"/><defs><marker id="randomized-arms-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#4f5d6b"/></marker></defs><path d="M150 232L233 232" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#randomized-arms-fig-arr)"/><path d="M193 232L193 321" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#randomized-arms-fig-arr)"/><g><rect x="24" y="324" width="206" height="124" rx="8" fill="#ffffff" stroke="#d5dce3" stroke-width="1.5"/><text x="38" y="354.12" font-size="17" fill="#1b2733" font-weight="700" style="white-space:pre;">Excluded  388</text><g><text x="74" y="383.4" font-size="15" text-anchor="end" fill="#1b2733" font-variant-numeric="tabular-nums">212</text><text x="84" y="383.4" font-size="15" fill="#4f5d6b">series already complete</text></g><g><text x="74" y="407.4" font-size="15" text-anchor="end" fill="#1b2733" font-variant-numeric="tabular-nums">109</text><text x="84" y="407.4" font-size="15" fill="#4f5d6b">no mobile number</text></g><g><text x="74" y="431.4" font-size="15" text-anchor="end" fill="#1b2733" font-variant-numeric="tabular-nums">67</text><text x="84" y="431.4" font-size="15" fill="#4f5d6b">declined consent</text></g></g><path d="M451.43 232L471.43 232Q483.43 232 483.43 220L483.43 120Q483.43 108 495.43 108L512.43 108" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#randomized-arms-fig-arr)"/><path d="M451.43 232L471.43 232Q483.43 232 483.43 244L483.43 344Q483.43 356 495.43 356L512.43 356" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#randomized-arms-fig-arr)"/><path d="M729.13 108L888 108" fill="none" stroke="#4f5d6b" stroke-width="1.8"/><path d="M729.13 356L888 356" fill="none" stroke="#4f5d6b" stroke-width="1.8"/><text x="741.13" y="98" font-size="15" fill="#4f5d6b">21 lost to follow-up</text><text x="741.13" y="346" font-size="15" fill="#4f5d6b">26 lost to follow-up</text><g class="ss-node ss-node-process" data-node="scr"><rect x="0" y="182.89" width="150" height="98.23" rx="10" fill="#f2f5f8" stroke="#d5dce3" stroke-width="1.4"/><text x="75" y="213.51" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="600"><tspan x="75" y="213.51">Assessed</tspan><tspan x="75" dy="20.74">for eligibility</tspan></text><text x="75" y="256.45" font-size="15" text-anchor="middle" fill="#4f5d6b">n = 1,204</text></g><g class="ss-node ss-node-process" data-node="rnd"><rect x="236" y="174.51" width="215.43" height="114.99" rx="10" fill="#f2f5f8" stroke="#1b2733" stroke-width="2.5"/><text x="343.72" y="205.13" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="600">Randomized 1:1</text><text x="343.72" y="227.33" font-size="15" text-anchor="middle" fill="#4f5d6b"><tspan x="343.72" y="227.33">n = 816</tspan><tspan x="343.72" dy="18.75">computer-generated list,</tspan><tspan x="343.72" dy="18.75">blocks of 4, by clinic</tspan></text></g><g class="ss-node ss-node-process" data-node="arm0"><rect x="515.43" y="59.88" width="213.7" height="96.24" rx="10" fill="#f2f5f8" stroke="#d5dce3" stroke-width="1.4"/><text x="622.28" y="90.5" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="600">Text reminders</text><text x="622.28" y="112.7" font-size="15" text-anchor="middle" fill="#4f5d6b"><tspan x="622.28" y="112.7">408 allocated</tspan><tspan x="622.28" dy="18.75">SMS on days 21, 25, 28</tspan></text></g><g class="ss-node ss-node-process" data-node="arm1"><rect x="515.43" y="307.88" width="213.7" height="96.24" rx="10" fill="#f2f5f8" stroke="#d5dce3" stroke-width="1.4"/><text x="622.28" y="338.5" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="600">Usual care</text><text x="622.28" y="360.7" font-size="15" text-anchor="middle" fill="#4f5d6b"><tspan x="622.28" y="360.7">408 allocated</tspan><tspan x="622.28" dy="18.75">appointment card only</tspan></text></g><text x="900" y="17.84" font-size="16" fill="#1b2733" font-weight="700">Second dose within 42 days</text><text x="900" y="41.1" font-size="15" fill="#4f5d6b">Share of each arm, one scale</text><g><rect x="900" y="93" width="127.91" height="30" rx="3" fill="#1d5fa6"/><rect x="900" y="93" width="180" height="30" rx="3" fill="none" stroke="#d5dce3" stroke-width="1"/><text x="1090" y="116.64" font-size="24" fill="#1d5fa6" font-weight="700">71%</text><text x="900" y="144.1" font-size="15" fill="#4f5d6b">275 of 387 followed up</text></g><g><rect x="900" y="341" width="104.14" height="30" rx="3" fill="#c3ccd5"/><rect x="900" y="341" width="180" height="30" rx="3" fill="none" stroke="#d5dce3" stroke-width="1"/><text x="1090" y="364.64" font-size="24" fill="#1b2733" font-weight="700">58%</text><text x="900" y="392.1" font-size="15" fill="#4f5d6b">221 of 382 followed up</text></g><text x="900" y="227.92" font-size="22" fill="#1d5fa6" font-weight="700">+13.2 points</text><text x="900" y="253.4" font-size="15" fill="#4f5d6b">95% CI 6.5 to 19.9</text></svg>
