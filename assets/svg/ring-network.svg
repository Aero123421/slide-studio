<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 444" width="1152" height="444" role="img" aria-labelledby="ring-network-fig-title ring-network-fig-desc" id="ring-network-fig" class="ss-fig" direction="ltr" font-family="&quot;Avenir Next&quot;,&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="ring-network-fig-title">Campus fibre ring drawn twice: on the site plan and as a ring</title><desc id="ring-network-fig-desc">Both panels show the same 8 buildings and the same 8 links; only positions differ. Left: positions to scale, north up; the ring follows service tunnels and crosses itself on paper. Right: the same links in cable order on a circle, where distance means nothing. Total straight-line length 2.3 km; the longest link, Energy centre to Emergency, is 368 m. Removing any one link leaves all 8 buildings connected (8 of 8 single cuts).</desc><rect x="0" y="0" width="1152" height="444" fill="#e4eaf1"/><text x="0" y="19.32" font-size="18" fill="#14243a" font-weight="700">Site plan, to scale</text><text x="0" y="43.84" font-size="16" fill="#45566b">where the cable runs</text><text x="640" y="19.32" font-size="18" fill="#14243a" font-weight="700">Ring, in cable order</text><text x="640" y="43.84" font-size="16" fill="#45566b">how the buildings connect; distance means nothing</text><line x1="612" x2="612" y1="0" y2="444" stroke="#b5c3d3" stroke-width="1.2"/><g class="ring-network-site"><line x1="278.67" y1="226.67" x2="475.11" y2="180.44" stroke="#14243a" stroke-width="2" stroke-linecap="round"/><line x1="475.11" y1="180.44" x2="527.11" y2="342.22" stroke="#14243a" stroke-width="2" stroke-linecap="round"/><line x1="527.11" y1="342.22" x2="382.67" y2="186.22" stroke="#1c4f9e" stroke-width="3.6" stroke-linecap="round"/><line x1="382.67" y1="186.2