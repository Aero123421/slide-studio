<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="roadmap-fig-title roadmap-fig-desc" id="roadmap-fig" class="ss-fig" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="roadmap-fig-title">路面電車延伸の段階：順序と、各段階の時期の根拠</title><desc id="roadmap-fig-desc">7段階を左から順に等間隔で並べた。間隔は順序だけを表し、時間の長さではない。日付があるのは完了した2段階と見込みの1段階だけ。「国の認可と財源確定」は時期未定で、その後の3段階は認可からの所要期間しか示せない。開業日は書かれていない。</desc><rect x="0" y="0" width="1152" height="470" fill="#f5f7f8"/><line x1="84" x2="412" y1="176" y2="176" stroke="#182a3e" stroke-width="3"/><line x1="412" x2="1068" y1="176" y2="176" stroke="#4d6072" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="84" cy="176" r="11" fill="#182a3e"/><text x="84" y="140" font-size="21" text-anchor="middle" fill="#182a3e" font-weight="700">構想・需要調査</text><text x="84" y="230.28" font-size="22" text-anchor="middle" fill="#182a3e" font-weight="700" font-variant-numeric="tabular-nums">2023年度</text><text x="84" y="262.58" font-size="17" text-anchor="middle" fill="#4d6072">完了</text><circle cx="248" cy="176" r="11" fill="#182a3e"/><text x="248" y="112.7" font-size="21" text-anchor="middle" fill="#182a3e" font-weight="700"><tspan x="248" y="112.7">基本計画と</tspan><tspan x="248" dy="27.3">住民説明会</tspan></text><text x="248" y="230.28" font-size="22" text-anchor="middle" fill="#182a3e" font-weight="700" font-variant-numeric="tabular-nums">2025年3月</text><text x="248" y="262.58" font-size="17" text-anchor="middle" fill="#4d6072">完了</text><circle cx="412" cy="176" r="10" fill="#f5f7f8" stroke="#182a3e" stroke-width="2.5"/><path d="M412 166A10 10 0 0 1 412 186Z" fill="#182a3e"/><text x="412" y="140" font-size="21" text-anchor="middle" fill="#182a3e" font-weight="700">環境影響評価</text><text x="412" y="108.7" font-size="16" text-anchor="middle" fill="#4d6072" font-weight="700">現在</text><text x="412" y="230.28" font-size="22" text-anchor="middle" fill="#182a3e" font-weight="700" font-variant-numeric="tabular-nums">2026年度後半</text><text x="412" y="262.58" font-size="17" text-anchor="middle" fill="#4d6072">見込み・公告予定</text><path d="M576 160L592 176L576 192L560 176Z" fill="#264c78" stroke="#f5f7f8" stroke-width="3"/><text x="576" y="112.7" font-size="21" text-anchor="middle" fill="#264c78" font-weight="700"><tspan x="576" y="112.7">国の認可と</tspan><tspan x="576" dy="27.3">財源確定</tspan></text><text x="576" y="230.28" font-size="22" text-anchor="middle" fill="#264c78" font-weight="700" font-variant-numeric="tabular-nums">時期未定</text><text x="576" y="262.58" font-size="17" text-anchor="middle" fill="#4d6072"><tspan x="576" y="262.58">国の</tspan><tspan x="576" dy="22.1">予算措置しだい</tspan></text><circle cx="740" cy="176" r="10" fill="#f5f7f8" stroke="#4d6072" stroke-width="2.2"/><text x="740" y="140" font-size="21" text-anchor="middle" fill="#182a3e" font-weight="700">詳細設計</text><text x="740" y="230.28" font-size="22" text-anchor="middle" fill="#4d6072" font-weight="600" font-variant-numeric="tabular-nums">約14か月</text><text x="740" y="262.58" font-size="17" text-anchor="middle" fill="#4d6072">認可から</text><circle cx="904" cy="176" r="10" fill="#f5f7f8" stroke="#4d6072" stroke-width="2.2"/><text x="904" y="140" font-size="21" text-anchor="middle" fill="#182a3e" font-weight="700">工事</text><text x="904" y="230.28" font-size="22" text-anchor="middle" fill="#4d6072" font-weight="600" font-variant-numeric="tabular-nums">約30か月</text><text x="904" y="262.58" font-size="17" text-anchor="middle" fill="#4d6072">設計完了から</text><circle cx="1068" cy="176" r="10" fill="#f5f7f8" stroke="#4d6072" stroke-width="2.2"/><text x="1068" y="140" font-size="21" text-anchor="middle" fill="#182a3e" font-weight="700">開業</text><text x="1068" y="230.28" font-size="22" text-anchor="middle" fill="#4d6072" font-weight="600" font-variant-numeric="tabular-nums">日付なし</text><text x="1068" y="262.58" font-size="17" text-anchor="middle" fill="#4d6072">認可後に算定</text><path d="M671.12 326v12H1136.88v-12" fill="none" stroke="#264c78" stroke-width="1.8"/><text x="904" y="368.06" font-size="19" text-anchor="middle" fill="#264c78" font-weight="700">この3段階は、認可が出るまで日付を付けない</text><text x="904" y="396.58" font-size="17" text-anchor="middle" fill="#4d6072">所要期間は前の段階の完了から数える</text></svg>
