="M720 373.5V374L737 390L754 374V373.5Z" fill="#c3ced4" stroke="#102b39" stroke-width="1"/><rect x="718" y="306" width="38" height="10" rx="2" fill="#102b39"/><text x="737" y="411.76" font-size="16" text-anchor="middle" fill="#102b39" font-weight="700">D1</text></g><g><path d="M766 316V374L783 390L800 374V316Z" fill="#ffffff" stroke="#102b39" stroke-width="1.5"/><path d="M766 373.5V374L783 390L800 374V373.5Z" fill="#c3ced4" stroke="#102b39" stroke-width="1"/><rect x="764" y="306" width="38" height="10" rx="2" fill="#102b39"/><text x="783" y="411.76" font-size="16" text-anchor="middle" fill="#102b39" font-weight="700">D2</text></g><text x="826" y="341" font-size="16" text-anchor="start" dominant-baseline="central" font-weight="700"><tspan fill="#23647c">K-0412</tspan><tspan fill="#102b39">-D1、D2</tspan></text><text x="826" y="372.4" font-size="15" fill="#4d6371">各100 µL、ゲノム解析へ</text></svg>
