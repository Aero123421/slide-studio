<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="sample-preparation-fig-title sample-preparation-fig-desc" id="sample-preparation-fig" class="ss-fig" direction="ltr" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="sample-preparation-fig-title">採血1本から子検体への分注フロー（ID・液量・保管先）</title><desc id="sample-preparation-fig-desc">EDTA管10.0 mL（K-0412）を2,000 ×g、10分、4 °Cで遠心し、血漿4.6 mL、バフィーコート0.4 mL、赤血球5.0 mLに分けた。血漿は500 µLずつ8本（P1〜P8）に分注し、残り0.6 mLは廃棄。バフィーコートからDNAを抽出しD1、D2とした。子検体は計10本で、IDはすべてK-0412から始まる。</desc><rect x="0" y="0" width="1152" height="470" fill="#ffffff"/><defs><marker id="sample-preparation-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#4d6371"/></marker></defs><text x="34" y="14.58" font-size="17" fill="#102b39" font-weight="700">採血</text><text x="34" y="37.1" font-size="15" fill="#4d6371">EDTA管、10.0 mL</text><text x="300" y="14.58" font-size="17" fill="#102b39" font-weight="700">遠心後</text><text x="300" y="37.1" font-size="15" fill="#4d6371">同じ縮尺（mL）</text><g><clipPath id="sample-preparation-fig-a"><path d="M34 92V411A29 29 0 0 0 92 411V92Z"/></clipPath><g clip-path="url(#sample-preparation-fig-a)"><rect x="34" y="150" width="58" height="294" fill="#4d6371"/><line fill="none" x1="34" x2="92" y1="150" y2="150" stroke="#102b39" stroke-width="1"/></g><path d="M34 92V411A29 29 0 0 0 92 411V92" fill="none" stroke="#102b39" stroke-width="2"/><rect x="30" y="72" width="66" height="20" rx="3" fill="#102b39"/></g><text x="63" y="458" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="700"><tspan fill="#23647c">K-0412</tspan></text><path d="M106 266H284" fill="none" stroke="#4d6371" stroke-width="1.6" marker-end="url(#sample-preparation-fig-arr)"/><text x="196" y="239.76" font-size="16" text-anchor="middle" fill="#102b39" font-weight="700">遠心分離</text><text x="196" y="291.65" font-size="15" text-anchor="middle" fill="#4d6371"><tspan x="196" y="291.65">2,000 ×g、10分</tspan><tspan x="196" dy="19.5">4 °C</tspan></text><g><clipPath id="sample-preparation-fig-b"><path d="M300 92V411A29 29 0 0 0 358 411V92Z"/></clipPath><g clip-path="url(#sample-preparation-fig-b)"><rect x="300" y="295" width="58" height="149" fill="#4d6371"/><rect x="300" y="283.4" width="58" height="11.6" fill="#ffffff"/><rect x="300" y="150" width="58" height="133.4" fill="#bcdae4"/><line fill="none" x1="300" x2="358" y1="295" y2="295" stroke="#102b39" stroke-width="1"/><line fill="none" x1="300" x2="358" y1="283.4" y2="283.4" stroke="#102b39" stroke-width="1"/><line fill="none" x1="300" x2="358" y1="150" y2="150" stroke="#102b39" stroke-width="1"/></g><path d="M300 92V411A29 29 0 0 0 358 411V92" fill="none" stroke="#102b39" stroke-width="2"/><rect x="296" y="72" width="66" height="20" rx="3" fill="#102b39"/></g><text x="329" y="458" font-size="16" text-anchor="middle" dominant-baseline="central" font-weight="700"><tspan fill="#23647c">K-0412</tspan></text><text x="372" y="222.46" font-size="16" fill="#102b39" font-weight="700">血漿 4.6 mL</text><text x="372" y="294.96" font-size="16" fill="#102b39" font-weight="700">バフィーコート 0.4 mL</text><text x="372" y="373.26" font-size="16" fill="#102b39" font-weight="700">赤血球 5.0 mL</text><path d="M475.432488 216.7H520V107H548" fill="none" stroke="#4d6371" stroke-width="1.6" marker-end="url(#sample-preparation-fig-arr)"/><path d="M559.832488 289.2H628V353H708" fill="none" stroke="#4d6371" stroke-width="1.6" marker-end="url(#sample-preparation-fig-arr)"/><text x="622" y="349" font-size="15" text-anchor="end" fill="#102b39" font-weight="700">DNA抽出</text><text x="372" y="396.9" font-size="15" fill="#4d6371">廃棄（量のみ記録）</text><text x="560" y="14.58" font-size="17" fill="#102b39" font-weight="700">分注：500 µLずつ8本</text><text x="560" y="37.1" font-size="15" fill="#4d6371">残り0.6 mLは廃棄量として記録</text><g><g><path d="M560 70V128L577 144L594 128V70Z" fill="#ffffff" stroke="#102b39" stroke-width="1.5"/><path d="M560 122V128L577 144L594 128V122Z" fill="#bcdae4" stroke="#102b39" stroke-width="1"/><rect x="558" y="60" width="38" height="10" rx="2" fill="#102b39"/><text x="577" y="165.76" font-size="16" text-anchor="middle" fill="#102b39" font-weight="700">P1</text></g><g><path d="M606 70V128L623 144L640 128V70Z" fill="#ffffff" stroke="#102b39" stroke-width="1.5"/><path d="M606 122V128L623 144L640 128V122Z" fill="#bcdae4" stroke="#102b39" stroke-width="1"/><rect x="604" y="60" width="38" height="10" rx="2" fill="#102b39"/><text x="623" y="165.76" font-size="16" text-anchor="middle" fill="#102b39" font-weight="700">P2</text></g><path d="M560 178v6H640v-6" fill="none" stroke="#4d6371" stroke-width="1.2"/><text x="600" y="207.1" font-size="15" text-anchor="middle" fill="#4d6371">プロテオーム解析</text></g><g><g><path d="M692 70V128L709 144L726 128V70Z" fill="#ffffff" stroke="#102b39" stroke-width="1.5"/><path d="M692 122V128L709 144L726 128V122Z" fill="#bcdae4" stroke="#102b39" stroke-width="1"/><rect x="690" y="60" width="38" height="10" rx="2" fill="#102b39"/><text x="709" y="165.76" font-size="16" text-anchor="middle" fill="#102b39" font-weight="700">P3</text></g><g><path d="M738 70V128L755 144L772 128V70Z" fill="#ffffff" stroke="#102b39" stroke-width="1.5"/><path d="M738 122V128L755 144L772 128V122Z" fill="#bcdae4" stroke="#102b39" stroke-width="1"/><rect x="736" y="60" width="38" height="10" rx="2" fill="#102b39"/><text x="755" y="165.76" font-size="16" text-anchor="middle" fill="#102b39" font-weight="700">P4</text></g><path d="M692 178v6H772v-6" fill="none" stroke="#4d6371" stroke-width="1.2"/><text x="732" y="207.1" font-size="15" text-anchor="middle" fill="#4d6371">代謝物解析</text></g><g