<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="scatter-fig-title scatter-fig-desc" id="scatter-fig" class="ss-fig" direction="ltr" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="scatter-fig-title">Tree canopy cover and afternoon land-surface temperature, 27 districts</title><desc id="scatter-fig-desc">Each dot is a district. Temperature falls as canopy rises (Pearson r = −0.82). The leafiest quarter averaged 35.8 °C, the barest 40.2 °C. Riverside has 7% canopy, like Dockside, but was 6.8 °C cooler.</desc><rect x="0" y="0" width="1152" height="470" fill="#f4f3ec"/><g class="ss-axis"><line x1="70" x2="1122" y1="404" y2="404" stroke="#e1e2d6" stroke-width="1" class="ss-grid"/><text x="62" y="409.76" font-size="16" text-anchor="end" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">34</text><line x1="70" x2="1122" y1="313" y2="313" stroke="#e1e2d6" stroke-width="1" class="ss-grid"/><text x="62" y="318.76" font-size="16" text-anchor="end" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">36</text><line x1="70" x2="1122" y1="222" y2="222" stroke="#e1e2d6" stroke-width="1" class="ss-grid"/><text x="62" y="227.76" font-size="16" text-anchor="end" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">38</text><line x1="70" x2="1122" y1="131" y2="131" stroke="#e1e2d6" stroke-width="1" class="ss-grid"/><text x="62" y="136.76" font-size="16" text-anchor="end" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">40</text><line x1="70" x2="1122" y1="40" y2="40" stroke="#e1e2d6" stroke-width="1" class="ss-grid"/><text x="62" y="45.76" font-size="16" text-anchor="end" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">42</text></g><g class="ss-axis"><line x1="70" x2="70" y1="40" y2="404" stroke="#1f2a22" stroke-width="1.4" class="ss-zero"/><line x1="70" x2="70" y1="404" y2="409" stroke="#d2d4c4"/><text x="70" y="428.84" font-size="16" text-anchor="middle" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">0%</text><line x1="420.67" x2="420.67" y1="40" y2="404" stroke="#e1e2d6" stroke-width="1" class="ss-grid"/><line x1="420.67" x2="420.67" y1="404" y2="409" stroke="#d2d4c4"/><text x="420.67" y="428.84" font-size="16" text-anchor="middle" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">20%</text><line x1="771.33" x2="771.33" y1="40" y2="404" stroke="#e1e2d6" stroke-width="1" class="ss-grid"/><line x1="771.33" x2="771.33" y1="404" y2="409" stroke="#d2d4c4"/><text x="771.33" y="428.84" font-size="16" text-anchor="middle" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">40%</text><line x1="1122" x2="1122" y1="40" y2="404" stroke="#e1e2d6" stroke-width="1" class="ss-grid"/><line x1="1122" x2="1122" y1="404" y2="409" stroke="#d2d4c4"/><text x="1122" y="428.84" font-size="16" text-anchor="middle" fill="#52604f" class="ss-axis-label" font-variant-numeric="tabular-nums">60%</text></g><line x1="70" x2="1122" y1="404" y2="404" stroke="#1f2a22" stroke-width="1.2"/><text x="22" y="20" font-size="16" fill="#52604f">Land-surface temperature, °C</text><text x="1122" y="458" font-size="16" text-anchor="end" fill="#52604f">Tree canopy cover, share of district area</text><g class="quarter-mean"><line x1="132.13" x2="200.73" y1="121.9" y2="121.9" stroke="#1f2a22" stroke-width="2" stroke-dasharray="6 4"/><text x="132.13" y="143.66" font-size="16" fill="#1f2a22" font-weight="600" stroke="#f4f3ec" stroke-width="4.48" stroke-linejoin="round" paint-order="stroke">Barest quarter: mean 40.2 °C</text></g><g class="quarter-mean"><line x1="728.27" x2="867" y1="322.1" y2="322.1" stroke="#1f2a22" stroke-width="2" stroke-dasharray="6 4"/><text x="875" y="327.86" font-size="16" fill="#1f2a22" font-weight="600" stroke="#f4f3ec" stroke-width="4.48" stroke-linejoin="round" paint-order="stroke">Leafiest quarter: mean 35.8 °C</text></g><circle cx="192.73" cy="117.35" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="333" cy="153.75" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="490.8" cy="176.5" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="140.13" cy="71.85" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="192.73" cy="44.55" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="473.27" cy="153.75" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="455.73" cy="153.75" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="262.87" cy="121.9" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="262.87" cy="94.6" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="666.13" cy="326.65" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="859" cy="313" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="841.47" cy="335.75" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="666.13" cy="299.35" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="508.33" cy="149.2" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="753.8" cy="349.4" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="823.93" cy="372.15" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="736.27" cy="326.65" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="823.93" cy="285.7" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="560.93" cy="249.3" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="385.6" cy="149.2" r="7" fill="#c6c8b9" stroke="#52604f" stroke-width="1"/><circle cx="140.13" cy="99.