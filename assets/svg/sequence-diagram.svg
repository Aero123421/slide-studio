<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="sequence-diagram-fig-title sequence-diagram-fig-desc" id="sequence-diagram-fig" class="ss-fig" direction="ltr" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="sequence-diagram-fig-title">Tap-to-ride at a fare gate: messages in order, with their times after the tap</title><desc id="sequence-diagram-fig-desc">Five participants, 8 messages, time running downward. Rows are spaced by order, not by latency; the rail at left places each message at its measured time. Solid arrows are requests, dashed arrows replies, open arrowheads asynchronous messages. The gate opens 0.18 s after the tap; the bank&#39;s approval reaches the fare service at 2.4 s, after the rider has passed.</desc><rect x="0" y="0" width="1152" height="470" fill="#171b21"/><text x="0" y="75.46" font-size="15" fill="#9ba6b1" font-weight="600">ms after tap</text><line x1="84" x2="84" y1="101.46" y2="430.46" stroke="#9ba6b1" stroke-width="1.4"/><line x1="79" x2="84" y1="101.46" y2="101.46" stroke="#9ba6b1"/><text x="74" y="106.86" font-size="15" text-anchor="end" fill="#9ba6b1" font-variant-numeric="tabular-nums">0</text><line x1="79" x2="84" y1="167.26" y2="167.26" stroke="#9ba6b1"/><text x="74" y="172.66" font-size="15" text-anchor="end" fill="#9ba6b1" font-variant-numeric="tabular-nums">500</text><line x1="79" x2="84" y1="233.06" y2="233.06" stroke="#9ba6b1"/><text x="74" y="238.46" font-size="15" text-anchor="end" fill="#9ba6b1" font-variant-numeric="tabular-nums">1,000</text><line x1="79" x2="84" y1="298.86" y2="298.86" stroke="#9ba6b1"/><text x="74" y="304.26" font-size="15" text-anchor="end" fill="#9ba6b1" font-variant-numeric="tabular-nums">1,500</text><l