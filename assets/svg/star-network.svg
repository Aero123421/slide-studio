<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="star-network-fig-title star-network-fig-desc" id="star-network-fig" class="ss-fig" direction="ltr" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="star-network-fig-title">検体搬送のネットワーク：中央検査センターと8つの診療所</title><desc id="star-network-fig-desc">8つの診療所がそれぞれ1本の線で中央検査センターにつながる。診療所どうしの線はない。線の長さは配置の都合で、時間や距離を表さない。線上の数字は片道の搬送時間（分）、線の太さは1日の検体数。最短は中央通り医院の9分、最長は北浜診療所の52分。センターには1日1,655件が集まる。</desc><rect x="0" y="0" width="800" height="470" fill="#f5f7f8"/><g class="star-network-spokes"><line x1="396" y1="205" x2="396" y2="62" stroke="#4d6072" stroke-width="8" stroke-linecap="round"/><line x1="429.99" y1="205" x2="547.32" y2="111.79" stroke="#4d6072" stroke-width="7.61" stroke-linecap="round"/><line x1="496.18" y1="232" x2="610" y2="232" stroke="#4d6072" stroke-width="6.62" stroke-linecap="round"/><line x1="429.99" y1="259" x2="547.32" y2="352.21" stroke="#4d6072" stroke-width="5.83" stroke-linecap="round"/><line x1="396" y1="259" x2="396" y2="402" stroke="#4d6072" stroke-width="5.05" stroke-linecap="round"/><line x1="362.01" y1="259" x2="244.68" y2="352.21" stroke="#4d6072" stroke-width="3.37" stroke-linecap="round"/><line x1="295.82" y1="232" x2="182" y2="232" stroke="#4d6072" stroke-width="3.86" stroke-linecap="round"/><line x1="362.01" y1="205" x2="244.68" y2="111.79" stroke="#4d6072" stroke-width="4.26" stroke-linecap="round"/></g><circle cx="396" cy="62" r="8" fill="#182a3e" stroke="#f5f7f8" stroke-width="3"/><circle cx="547.32" cy="111.79" r="8" fill="#182a3e" stroke="#f5f7f8" stroke-width="3"/><circle cx="610" cy="232" r="8" fill="#182a3e" stroke="#f5f7f8" stroke-width="3"/><circle cx="547.32" cy="352.21" r="8" fill="#182a3e" stro