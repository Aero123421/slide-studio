<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 444" width="1152" height="444" role="img" aria-labelledby="state-contract-fig-title state-contract-fig-desc" id="state-contract-fig" class="ss-fig" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="state-contract-fig-title">Card payment states with allowed and forbidden moves, and one payment&#39;s record</title><desc id="state-contract-fig-desc">Six states. Solid arrows are the only allowed moves (created to authorised on approve, authorised to captured on capture, captured to settled on settle, settled to refunded on refund, authorised to voided on void); dashed arrows marked with a cross are explicitly forbidden (re-authorise, capture after void). Below, payment pay_7Q2KX is shown at each state it passed through: its payment_id, currency and authorised amount stay the same through 4 changes of state; captured never exceeds authorised and refunded (€45.00) never exceeds captured.</desc><rect x="0" y="0" width="1152" height="444" fill="#fcfcfb"/><defs><marker id="state-contract-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#161c1a"/></marker><marker id="state-contract-fig-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9.9" markerHeight="9.9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#9e2c2c"/></marker></defs><line x1="216" x2="216" y1="134" y2="432" stroke="#d5dad8" stroke-width="1" stroke-dasharray="2 4"/><line x1="424" x2="424" y1="134" y2="432" stroke="#d5dad8" stroke-width="1" stroke-dasharray="2 4"/><line x1="632" x2="632" y1="134" y2="432" stroke="#d5dad8" stroke-width="1" stroke-dasharray="2 4"/><line x1="840" x2="840" y1="134" y2="432" stroke="#d5dad8" stroke-width="1" stroke-dasharray="2 4"/><line x1="1048" x2="1048" y1="134" y2="432" stroke="#d5dad8" stroke-width="1" stroke-dasharray="2 4"/><text x="0" y="284.76" font-size="16" fill="#161c1a" font-weight="600" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace">payment_id</text><rect x="118" y="267" width="1028" height="24" rx="12" fill="#0e7c6b"/><text x="132" y="284.76" font-size="16" fill="#ffffff" font-weight="650" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-variant-numeric="tabular-nums">pay_7Q2KX</text><text x="0" y="318.76" font-size="16" fill="#161c1a" font-weight="600" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace">currency</text><rect x="118" y="301" width="1028" height="24" rx="12" fill="#0e7c6b"/><text x="132" y="318.76" font-size="16" fill="#ffffff" font-weight="650" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-variant-numeric="tabular-nums">EUR</text><text x="0" y="352.76" font-size="16" fill="#161c1a" font-weight="600" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace">authorised</text><rect x="326" y="335" width="820" height="24" rx="12" fill="#0e7c6b"/><text x="340" y="352.76" font-size="16" fill="#ffffff" font-weight="650" font-variant-numeric="tabular-nums">€120.00</text><text x="0" y="386.76" font-size="16" fill="#54605c" font-weight="600" font-family="&quot;JetBrains Mono&quot;,&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace">captured</text><rect x="534" y="369" width="612" height="24" rx="12" fill="#f0f2f1" stroke="#d5dad8"/><text x="548" y="386.76" font-size="16" fill="#161c1a" 