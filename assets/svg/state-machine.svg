<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 446" width="1152" height="446" role="img" aria-labelledby="state-machine-fig-title state-machine-fig-desc" id="state-machine-fig" class="ss-fig" direction="ltr" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="state-machine-fig-title">Allowed states and transitions of an outpatient referral, March cohort</title><desc id="state-machine-fig-desc">Seven states. Each arrow is one allowed transition, labelled with its event or [guard] and the number of referrals that took it; no other moves exist. Of 1,000 referrals, 852 were discharged after a visit and 148 returned to the GP unseen: 120 at triage and 28 after a second missed visit.</desc><rect x="0" y="0" width="1152" height="446" fill="#ffffff"/><defs><marker id="state-machine-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#4f5d6b"/></marker><marker id="state-machine-fig-arr-em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11.7" markerHeight="11.7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#1d5fa6"/></marker></defs><g class="ss-edges"><path d="M217.76 40.59L365.46 40.59" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#state-machine-fig-arr)" stroke-linecap="round"/><path d="M456.97 81.18L456.97 178.41" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#state-machine-fig-arr)" stroke-linecap="round"/><path d="M544.47 40.59L949.09 40.59" fill="none" stroke="#1d5fa6" stroke-width="2.6" marker-end="url(#state-machine-fig-arr-em)" stroke-linecap="round"/><path d="M456.97 263.59L456.97 373.82" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#state-machine-fig-arr)" stroke-linecap="round"/><path d="M544.47 211L710.16 211" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#state-machine-fig-arr)" stroke-linecap="round"/><path d="M714.16 235L548.47 235" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#state-machine-fig-arr)" stroke-linecap="round"/><path d="M890.45 223L1040.54 223Q1052.54 223 1052.54 211L1052.54 85.18" fill="none" stroke="#1d5fa6" stroke-width="2.6" marker-end="url(#state-machine-fig-arr-em)" stroke-linecap="round"/><path d="M544.47 405.41L949.09 405.41" fill="none" stroke="#4f5d6b" stroke-width="1.8" marker-end="url(#state-machine-fig-arr)" stroke-linecap="round"/></g><g class="ss-node ss-node-terminal" data-node="received"><rect x="0" y="13" width="217.76" height="55.18" rx="27.59" fill="#ffffff" stroke="#d5dce3" stroke-width="1.4"/><text x="108.88" y="45.34" font-size="19" text-anchor="middle" fill="#1b2733" font-weight="600">Referral received</text></g><g class="ss-node ss-node-process" data-node="triaged"><rect x="369.46" y="0" width="175.02" height="81.18" rx="10" fill="#ffffff" stroke="#d5dce3" stroke-width="1.4"/><text x="456.97" y="32.34" font-size="19" text-anchor="middle" fill="#1b2733" font-weight="600">Triaged</text><text x="456.97" y="55.62" font-size="16" text-anchor="middle" fill="#4f5d6b">consultant review</text></g><g class="ss-node ss-node-process" data-node="booked"><rect x="369.46" y="182.41" width="175.02" height="81.18" rx="10" fill="#ffffff" stroke="#d5dce3" stroke-width="1.4"/><text x="456.97" y="214.75" font-size="19" text-anchor="middle" fill="#1b2733" font-weight="600">Booked</text><text x="456.97" y="238.03" font-size="16" text-anchor="middle" fill="#4f5d6b">appointment set</text></g><g class="ss-node ss-node-process" data-node="seen"><rect x="369.46" y="377.82" width="175.02" height="55.18" rx="10" fill="#ffffff" stroke="#d5dce3" stroke-width="1.4"/><text x="456.97" y="410.16" font-size="19" text-anchor="middle" fill="#1b2733" font-weight="600">Seen in clinic</text></g><g class="ss-node ss-node-process" data-node="dna"><rect x="714.16" y="195.41" width="176.29" height="55.18" rx="10" fill="#ffffff" stroke="#d5dce3" stroke-width="1.4"/><text x="802.3" y="227.75" font-size="19" text-anchor="middle" fill="#1b2733" font-weight="600">Did not attend</text></g><g class="ss-node ss-node-terminal" data-node="returned"><rect x="953.09" y="0" width="198.91" height="81.18" rx="40.59" fill="#1d5fa6" stroke="#1d5fa6" stroke-width="1.4"/><text x="1052.54" y="32.34" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="600">Back to the GP</text><text x="1052.54" y="55.62" font-size="16" text-anchor="middle" fill="#ffffff">148 referrals</text></g><g class="ss-node ss-node-terminal" data-node="discharged"><rect x="953.09" y="364.82" width="198.91" height="81.18" rx="40.59" fill="#ffffff" stroke="#d5dce3" stroke-width="1.4"/><text x="1052.54" y="397.16" font-size="19" text-anchor="middle" fill="#1b2733" font-weight="600">Discharged</text><text x="1052.54" y="420.44" font-size="16" text-anchor="middle" fill="#4f5d6b">852 referrals</text></g><g class="ss-edge-labels"><text x="291.61" y="26.85" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">review<tspan fill="#4f5d6b" font-weight="400" font-variant-numeric="tabular-nums">  1,000</tspan></text><text x="468.97" y="135.92" font-size="17" fill="#1b2733" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">accepted<tspan fill="#4f5d6b" font-weight="400" font-variant-numeric="tabular-nums">  880</tspan></text><text x="746.78" y="26.85" font-size="17" text-anchor="middle" fill="#1d5fa6" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">criteria not met<tspan fill="#1d5fa6" font-weight="400" font-variant-numeric="tabular-nums">  120</tspan></text><text x="468.97" y="324.83" font-size="17" fill="#1b2733" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">attends<tspan fill="#4f5d6b" font-weight="400" font-variant-numeric="tabular-nums">  852</tspan></text><text x="627.32" y="197.26" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">no-show<tspan fill="#4f5d6b" font-weight="400" font-variant-numeric="tabular-nums">  124</tspan></text><text x="631.32" y="257.58" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">[1st] rebook<tspan fill="#4f5d6b" font-weight="400" font-variant-numeric="tabular-nums">  96</tspan></text><text x="1040.54" y="160.21" font-size="17" text-anchor="end" fill="#1d5fa6" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">[2nd] return<tspan fill="#1d5fa6" font-weight="400" font-variant-numeric="tabular-nums">  28</tspan></text><text x="746.78" y="391.67" font-size="17" text-anchor="middle" fill="#1b2733" font-weight="600" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke">treated<tspan fill="#4f5d6b" font-weight="400" font-variant-numeric="tabular-nums">  852</tspan></text></g><text x="0" y="400.8" font-size="16" fill="#4f5d6b"><tspan x="0" y="400.8">Each arrow is an allowed move.</tspan><tspan x="0" dy="21.6">Label: event or [guard], then</tspan><tspan x="0" dy="21.6">number of referrals.</tspan></text></svg>
