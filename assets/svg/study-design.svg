<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 470" width="1152" height="470" role="img" aria-labelledby="study-design-fig-title study-design-fig-desc" id="study-design-fig" class="ss-fig" font-family="&quot;Segoe UI&quot;,&quot;Helvetica Neue&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;BIZ UDPGothic&quot;,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;"><title id="study-design-fig-title">Study design: question, protocol, observations and inference for a cool-roof classroom study</title><desc id="study-design-fig-desc">Four columns. Question: do reflective roof coatings keep top-floor classrooms cooler? Protocol: 12 room pairs, coating assigned by coin toss within each pair, 41 hot school days. Observations: in 12 of 12 pairs the coated room was cooler; mean difference −1.8 °C (95% CI −2.2 to −1.3). Inference: a claim about air temperature only; learning, energy use and winter heating were not tested. Arrows show the order of reasoning, not evidence.</desc><rect x="0" y="0" width="1152" height="470" fill="#f7f9f9"/><defs><marker id="study-design-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#465559"/></marker></defs><g><text x="0" y="24.12" font-size="17" fill="#465559" font-weight="700">Question</text><line fill="none" x1="90.08" x2="234" y1="18" y2="18" stroke="#465559" stroke-width="1.5" marker-end="url(#study-design-fig-arr)"/></g><g><text x="246" y="24.12" font-size="17" fill="#465559" font-weight="700">Protocol</text><line fill="none" x1="329.73" x2="542" y1="18" y2="18" stroke="#465559" stroke-width="1.5" marker-end="url(#study-design-fig-arr)"/></g><g><text x="554" y="24.12" font-size="17" fill="#1c262a" font-weight="700">Observations</text><line fill="none" x1="679.99" x2="950" y1="18" y2="18" stroke="#465559" stroke-width="1.5" marker-end="url(#study-design-fig-arr)"/></g><g><text x="962" y="24.12" font-size="17" fill="#465559" font-weight="700">Inference</text></g><g><text x="0" y="80.28" font-size="22" fill="#1c262a" font-weight="600"><tspan x="0" y="80.28">Do reflective roof</tspan><tspan x="0" dy="27.94">coatings keep</tspan><tspan x="0" dy="27.94">top-floor</tspan><tspan x="0" dy="27.94">classrooms cooler</tspan><tspan x="0" dy="27.94">on hot afternoons?</tspan></text><g><text x="0" y="249.1" font-size="15" fill="#465559" font-weight="700">Unit</text><text x="0" y="272.58" font-size="17" fill="#1c262a">Top-floor classroom</text></g><g><text x="0" y="307.1" font-size="15" fill="#465559" font-weight="700">Exposure</text><text x="0" y="330.58" font-size="17" fill="#1c262a">Reflective roof coating</text></g><g><text x="0" y="365.1" font-size="15" fill="#465559" font-weight="700">Outcome</text><text x="0" y="388.58" font-size="17" fill="#1c262a">Air temperature, 13:00–16:00</text></g></g><g><text x="246" y="76.58" font-size="17" fill="#1c262a" font-weight="700">12 pairs of rooms</text><text x="246" y="102.84" font-size="16" fill="#465559">Same school, same orientation</text><text x="246" y="139.9" font-size="15" fill="#465559">West</text><text x="246" y="156.9" font-size="15" fill="#465559">East</text><g><rect x="296" y="128" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><rect x="296" y="145" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="302.5" x2="302.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="313" y="128" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><rect x="313" y="145" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="319.5" x2="319.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="330" y="128" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><rect x="330" y="145" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="336.5" x2="336.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="347" y="128" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><rect x="347" y="145" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="353.5" x2="353.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="364" y="128" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><rect x="364" y="145" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="370.5" x2="370.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="381" y="128" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><rect x="381" y="145" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="387.5" x2="387.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="398" y="128" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><rect x="398" y="145" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="404.5" x2="404.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="415" y="128" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><rect x="415" y="145" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="421.5" x2="421.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="432" y="128" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><rect x="432" y="145" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="438.5" x2="438.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="449" y="128" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><rect x="449" y="145" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="455.5" x2="455.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="466" y="128" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><rect x="466" y="145" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="472.5" x2="472.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><g><rect x="483" y="128" width="13" height="13" rx="2" fill="#1c262a" stroke="#1c262a" stroke-width="1.5"/><rect x="483" y="145" width="13" height="13" rx="2" fill="#f7f9f9" stroke="#1c262a" stroke-width="1.5"/><line fill="none" x1="489.5" x2="489.5" y1="141" y2="145" stroke="#1c262a" stroke-width="1.5"/></g><rect x="246" y="174" width="12" height="12" rx="2" fill="#1c262a"/><text x="265" y="185.4" font-size="15" fill="#465559">coated room, by coin toss</text><g><text x="246" y="233.1" font-size="15" fill="#465559" font-weight="700">Measure</text><text x="246" y="254.84" font-size="16" fill="#1c262a"><tspan x="246" y="254.84">Logger every 15 min,</tspan><tspan x="246" dy="20.8">13:00–16:00</tspan></text></g><g><text x="246" y="303.1" font-size="15" fill="#465559" font-weight="700">Days</text><text x="246" y="324.84" font-size="16" fill="#1c262a"><tspan x="246" y="324.84">41 school days ≥ 30 °C,</tspan><tspan x="246" dy="20.8">Jun–Sep 2025</tspan></text></g><g><text x="246" y="373.1" font-size="15" fill="#465559" font-weight="700">Compare</text><text x="246" y="394.84" font-size="16" fill="#1c262a"><tspan x="246" y="394.84">Coated − uncoated,</tspan><tspan x="246" dy="20.8">within each pair</tspan></text></g></g><g><rect x="538" y="40" width="384" height="406" rx="10" fill="#e9f0f0"/><text x="554" y="69.1" font-size="15" fill="#465559">Coated − uncoated, °C</text><text x="906" y="69.1" font-size="15" text-anchor="end" fill="#1c262a" font-weight="700">12 of 12 pairs cooler</text><g><line fill="none" x1="598" x2="598" y1="84" y2="384" stroke="#dee5e6" stroke-width="1"/><text x="598" y="405.1" font-size="15" text-anchor="middle" fill="#465559">−3</text></g><g><line fill="none" x1="674" x2="674" y1="84" y2="384" stroke="#dee5e6" stroke-width="1"/><text x="674" y="405.1" font-size="15" text-anchor="middle" fill="#465559">−2</text></g><g><line fill="none" x1="750" x2="750" y1="84" y2="384" stroke="#dee5e6" stroke-width="1"/><text x="750" y="405.1" font-size="15" text-anchor="middle" fill="#465559">−1</text></g><g><line fill="none" x1="826" x2="826" y1="84" y2="384" stroke="#1c262a" stroke-width="1.5"/><text x="826" y="405.1" font-size="15" text-anchor="middle" fill="#465559">0</text></g><g><line fill="none" x1="902" x2="902" y1="84" y2="384" stroke="#dee5e6" stroke-width="1"/><text x="902" y="405.1" font-size="15" text-anchor="middle" fill="#465559">+1</text></g><g><text x="554" y="101.4" font-size="15" fill="#465559">P04</text><line fill="none" x1="826" x2="613.2" y1="96" y2="96" stroke="#c2cfd0" stroke-width="1.5"/><circle cx="613.2" cy="96" r="5" fill="#1c262a"/></g><g><text x="554" y="123.4" font-size="15" fill="#465559">P10</text><line fill="none" x1="826" x2="628.4" y1="118" y2="118" stroke="#c2cfd0" stroke-width="1.5"/><circle cx="628.4" cy="118" r="5" fill="#1c262a"/></g><g><text x="554" y="145.4" font-size="15" fill="#465559">P01</text><line fill="none" x1="826" x2="643.6" y1="140" y2="140" stroke="#c2cfd0" stroke-width="1.5"/><circle cx="643.6" cy="140" r="5" fill="#1c262a"/></g><g><text x="554" y="167.4" font-size="15" fill="#465559">P07</text><line fill="none" x1="826" x2="658.8" y1="162" y2="162" stroke="#c2cfd0" stroke-width="1.5"/><circle cx="658.8" cy="162" r="5" fill="#1c262a"/></g><g><text x="554" y