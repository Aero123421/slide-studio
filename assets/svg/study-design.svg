6" font-weight="700">1.8 °C cooler on average (95% CI 1.3 to 2.2)</text></g><g><text x="962" y="75.1" font-size="15" fill="#465559" font-weight="700">Supported</text><text x="962" y="98.58" font-size="17" fill="#1c262a"><tspan x="962" y="98.58">Coating lowers</tspan><tspan x="962" dy="22.1">hot-afternoon</tspan><tspan x="962" dy="22.1">classroom air</tspan><tspan x="962" dy="22.1">temperature by about</tspan><tspan x="962" dy="22.1">1.8 °C in this climate.</tspan></text><text x="962" y="237.1" font-size="15" fill="#465559" font-weight="700">Not tested here</text><text x="962" y="263.84" font-size="16" fill="#465559">Learning or attendance</text><text x="962" y="288.84" font-size="16" fill="#465559">Energy use</text><text x="962" y="313.84" font-size="16" fill="#465559">Winter heating</text><text x="962" y="338.84" font-size="16" fill="#465559">Other roof types</text></g><text x="0" y="466" font-size="15" fill="#465559">Arrows give the order of reasoning, not evidence; only the shaded column was measured.</text></svg>
