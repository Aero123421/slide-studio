<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 444" width="1152" height="444" role="img" aria-labelledby="transformation-lineage-fig-title transformation-lineage-fig-desc" id="transformation-lineage-fig" class="ss-fig" direction="ltr" font-family="&quot;Helvetica Neue&quot;,&quot;Segoe UI&quot;,&quot;Liberation Sans&quot;,Arial,sans-serif,&quot;Hiragino Sans&quot;,&quot;Noto Sans JP&quot;,&quot;Yu Gothic&quot;,&quot;Meiryo&quot;,&quot;IPAPGothic&quot;,sans-serif" style="overflow:visible;direction:ltr;"><title id="transformation-lineage-fig-title">Lineage of the reported Q3 gross margin</title><desc id="transformation-lineage-fig-desc">4 sources, 2 scheduled jobs and one manual step lead to the reported gross margin of 41.2%. Arrows mean &quot;is an input to&quot;. Sources enter where they are first used: ledger and FX rates are converted to euros, returns are netted out, then freight invoices are allocated by hand in a spreadsheet. Without that allocation the margin would read 44.6%, 3.5 points higher.</desc><rect x="0" y="0" width="1152" height="444" fill="#fbfaf7"/><defs><marker id="transformation-lineage-fig-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#55555c"/></marker><marker id="transformation-lineage-fig-arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#1b1b1f"/></marker><marker id="transformation-lineage-fig-arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.6L10 5L0 9.4Z" fill="#6e1f2e"/></marker><marker id="transformation-lineage-fig-arr-open" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.8" markerHeight="10.8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#55555c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="ss-edges"><path d="M192.53 155L242.06 155" stroke="#55555c" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#transformation-lineage-fig-arr)"/><path d="M184 292.18L208.06 292.18Q220.06 292.18 220.06 280.18L220.06 166Q220.06 155 231.06 155L242.06 155" stroke="#55555c" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#transformation-lineage-fig-arr)"/><path d="M437.84 155L453.78 155Q465.37 155 465.37 143.41L465.37 142.82Q465.37 131.82 476.37 131.82L487.37 131.82" stroke="#55555c" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#transformation-lineage-fig-arr)"/><path d="M416.45 296.18L453.37 296.18Q465.37 296.18 465.37 284.18L465.37 142.82Q465.37 131.82 476.37 131.82L487.37 131.82" stroke="#55555c" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#transformation-lineage-fig-arr)"/><path d="M674.9 131.82L690.43 131.82Q702.43 131.82 702.43 143.82L702.43 197.2Q702.43 208.2 713.43 208.2L724.43 208.2" stroke="#6e1f2e" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#transformation-lineage-fig-arr-accent)"/><path d="M658.49 284.59L690.43 284.59Q702.43 284.59 702.43 272.59L702.43 219.2Q702.43 208.2 713.43 208.2L724.43 208.2" stroke="#6e1f2e" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#transformation-lineage-fig-arr-accent)"/><path d="M911.96 208.2L961.49 208.2" stroke="#6e1f2e" stroke-width="2.6" fill="none" stroke-linecap="round" marker-end="url(#transformation-lineage-fig-arr-accent)"/></g><g class="ss-node ss-node-store" data-node="gl"><g><path d="M4 117.41V192.59A94.27 9 0 0 0 192.53 192.59V117.41" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/><ellipse cx="98.27" cy="117.41" rx="94.27" ry="9" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/></g><text x="98.27" y="146.75" font-size="19" text-anchor="middle" fill="#1b1b1f" font-weight="600">General ledger</text><text x="98.27" y="170.03" font-size="16" text-anchor="middle" fill="#55555c">gl.journal_lines</text></g><g class="ss-node ss-node-store" data-node="fx"><g><path d="M12.53 254.59V329.77A85.73 9 0 0 0 184 329.77V254.59" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/><ellipse cx="98.27" cy="254.59" rx="85.73" ry="9" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/></g><text x="98.27" y="283.93" font-size="19" text-anchor="middle" fill="#1b1b1f" font-weight="600">FX rates</text><text x="98.27" y="307.21" font-size="16" text-anchor="middle" fill="#55555c">treasury.fx_daily</text></g><g class="ss-node ss-node-process" data-node="convert"><rect x="245.06" y="114.41" width="192.78" height="81.18" rx="10" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/><text x="341.45" y="146.75" font-size="19" text-anchor="middle" fill="#1b1b1f" font-weight="600">Convert to EUR</text><text x="341.45" y="170.03" font-size="16" text-anchor="middle" fill="#55555c">job fin-104</text></g><g class="ss-node ss-node-store" data-node="rma"><g><path d="M266.45 248.59V343.77A75 9 0 0 0 416.45 343.77V248.59" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/><ellipse cx="341.45" cy="248.59" rx="75" ry="9" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/></g><text x="341.45" y="277.93" font-size="19" text-anchor="middle" fill="#1b1b1f" font-weight="600">Returns</text><text x="341.45" y="301.21" font-size="16" text-anchor="middle" fill="#55555c"><tspan x="341.45" y="301.21">rma.returns,</tspan><tspan x="341.45" dy="20">€0.52 m</tspan></text></g><g class="ss-node ss-node-process" data-node="net"><rect x="490.37" y="91.23" width="184.53" height="81.18" rx="10" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/><text x="582.63" y="123.57" font-size="19" text-anchor="middle" fill="#1b1b1f" font-weight="600">Net out returns</text><text x="582.63" y="146.85" font-size="16" text-anchor="middle" fill="#55555c">job fin-117</text></g><g class="ss-node ss-node-store" data-node="freight"><g><path d="M506.78 225.41V343.77A75.86 9 0 0 0 658.49 343.77V225.41" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/><ellipse cx="582.63" cy="225.41" rx="75.86" ry="9" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/></g><text x="582.63" y="254.75" font-size="19" text-anchor="middle" fill="#1b1b1f" font-weight="600"><tspan x="582.63" y="254.75">Freight</tspan><tspan x="582.63" dy="23.18">invoices</tspan></text><text x="582.63" y="301.21" font-size="16" text-anchor="middle" fill="#55555c"><tspan x="582.63" y="301.21">ap.freight_q3,</tspan><tspan x="582.63" dy="20">€0.41 m</tspan></text></g><g class="ss-node ss-node-process" data-node="alloc"><rect x="727.43" y="157.61" width="184.53" height="101.18" rx="10" fill="#6e1f2e" stroke="#6e1f2e" stroke-width="1.4"/><text x="819.7" y="189.95" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="600">Allocate freight</text><text x="819.7" y="213.23" font-size="16" text-anchor="middle" fill="#ffffff"><tspan x="819.7" y="213.23">manual</tspan><tspan x="819.7" dy="20">spreadsheet</tspan></text></g><g class="ss-node ss-node-terminal" data-node="margin"><rect x="964.49" y="156.02" width="183.51" height="104.36" rx="52.18" fill="#fbfaf7" stroke="#d3d2cd" stroke-width="1.4"/><text x="1056.25" y="188.36" font-size="19" text-anchor="middle" fill="#1b1b1f" font-weight="600"><tspan x="1056.25" y="188.36">Gross margin</tspan><tspan x="1056.25" dy="23.18">41.2%</tspan></text><text x="1056.25" y="234.82" font-size="16" text-anchor="middle" fill="#55555c">Q3, as reported</text></g><g class="ss-edge-labels"/><g class="lineage-note"><line x1="819.7" x2="819.7" y1="264.79" y2="298.79" stroke="#6e1f2e" stroke-width="1.4"/><text x="819.7" y="319.37" font-size="17" text-anchor="middle" fill="#6e1f2e" font-weight="700">without this step: 44.6%</text><text x="819.7" y="342.63" font-size="16" text-anchor="middle" fill="#55555c">3.5 points higher</text></g></svg>
